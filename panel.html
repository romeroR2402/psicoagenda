<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel del especialista · MiConsulta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/app.css">
<style>
.auth{max-width:440px;margin:48px auto;padding-bottom:48px}
.auth h1{font-size:28px;margin-bottom:6px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow-y:auto;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.side a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:13px;color:var(--muted);font-weight:600;text-decoration:none;font-size:14px;position:relative}
.side a:hover{background:var(--card)}
.side a[aria-current="page"]{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.side .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:800;display:grid;place-items:center}
.side hr{border:0;border-top:1px solid var(--line);margin:10px 4px;width:calc(100% - 8px)}
.content{padding-block:28px 64px;min-width:0}
.content>.wrap{max-width:1040px}
.title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.title-row h1{font-size:clamp(24px,3vw,30px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-weight:600}
.steps{display:flex;flex-direction:column;gap:8px}
.stepi{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--bg)}
.stepi .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--line);color:var(--muted);font-size:12px;font-weight:800}
.stepi.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.stepi>div{flex:1;min-width:0}
.stepi small{display:block;color:var(--muted);font-size:12px}
.ap{display:flex;flex-direction:column;gap:12px;border-left:4px solid var(--bar,var(--line))}
.ap.s-review{--bar:var(--calm)} .ap.s-unpaid{--bar:var(--warn)} .ap.s-confirmed{--bar:var(--ok)} .ap.s-rejected,.ap.s-cancelled{--bar:var(--bad)}
.ap-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.rcpt-img{display:block;width:100%;max-height:65vh;object-fit:contain;border-radius:14px;background:var(--card)}
.wk{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.wk:first-of-type{border-top:0}
.wk .ranges{display:flex;flex-direction:column;gap:8px}
.rng{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rng input{width:auto;padding:8px 10px}
.mini-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;display:grid;place-items:center;flex:none}
.mini-btn.bad{color:var(--bad)}
.toff{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.toff:first-child{border-top:0}
.qb{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.qb-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qb-h b{font-size:13px;color:var(--muted)}
.qb-tools{display:flex;gap:4px}
.qb-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qb-row select{flex:1 1 200px;width:auto}
.opt-row{display:flex;gap:8px;align-items:center}
.mark{width:16px;height:16px;border:2px solid var(--muted);flex:none}
.mark.single{border-radius:50%} .mark.multi{border-radius:4px}
.lnk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.lnk>div{flex:1 1 200px;min-width:0}
.ans{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.ans li{display:flex;justify-content:space-between;gap:12px}
.ans li span{color:var(--muted)}
.ans li b{text-align:right}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600}
.sugg button[aria-pressed="true"]{background:var(--calm-soft);color:var(--calm);border-color:transparent}
.rng{border-left:4px solid var(--lc,var(--line));padding:4px 0 4px 10px;border-radius:4px}
.rng .loc-sel{width:auto;min-width:170px;flex:1 1 170px}
.rng.clash{background:var(--bad-soft);border-left-color:var(--bad);border-radius:10px}
.ldot{display:none}
.loc-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:600;margin:6px 0 4px}
.loc-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.banner-acc{display:flex;gap:10px;align-items:flex-start;background:var(--calm-soft);color:var(--calm);border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600;margin-bottom:16px}
.banner-acc.warn{background:var(--warn-soft);color:var(--warn)}
.banner-acc svg{flex:none;margin-top:2px}
.cl-card{text-align:left;width:100%;cursor:pointer;border:1px solid transparent}
.cl-card:hover{border-color:var(--accent)}
.back-link{display:inline-block;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;margin-bottom:12px}
.pat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.pat-head small{display:block;color:var(--muted)}
.note-priv{display:flex;gap:8px;align-items:center;background:var(--calm-soft);color:var(--calm);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600}
.nt-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.locmap{height:260px;border-radius:14px;overflow:hidden;border:1px solid var(--line);z-index:0}
/* calendario */
.cal-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cal-bar h2{font-size:18px;margin-right:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-2px}
.cal{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow-x:auto}
.cal-grid{display:grid;grid-template-columns:52px repeat(7,minmax(108px,1fr));min-width:820px}
.cal-h{padding:10px 6px;text-align:center;font-weight:700;font-size:12.5px;border-bottom:1px solid var(--line);text-transform:capitalize}
.cal-h.today{color:var(--accent)}
.cal-times{position:relative}
.cal-times span{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.cal-col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hp))}
.cal-col.off{background:repeating-linear-gradient(135deg,var(--bg) 0 8px,var(--line) 8px 9px)}
.band{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--lc,var(--ok)) 13%,transparent);border-left:3px solid var(--lc,var(--ok))}
.band span{position:absolute;bottom:3px;left:6px;right:4px;font-size:10px;font-weight:700;color:var(--lc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.off-l{position:absolute;top:8px;left:6px;right:6px;font-size:11px;font-weight:700;color:var(--muted);text-align:center;background:var(--card);border-radius:8px;padding:3px}
.ev{position:absolute;left:4px;right:4px;border-radius:9px;padding:3px 7px;font-size:11px;line-height:1.25;text-align:left;overflow:hidden;border-left:3px solid var(--bar);z-index:1}
.ev b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.s-review{--bar:var(--calm);background:var(--calm-soft);color:var(--ink)} .ev.s-unpaid{--bar:var(--warn);background:var(--warn-soft);color:var(--ink)} .ev.s-confirmed{--bar:var(--ok);background:var(--ok-soft);color:var(--ink)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2}
.cal-list{display:none;flex-direction:column;gap:12px}
.cal-day h4{margin:0 0 8px;font-size:15px}
.cal-day .ev{position:static;display:block;width:100%;margin-top:6px;padding:8px 10px}
@media (max-width:700px){.cal{display:none}.cal-list{display:flex}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);align-content:start}
  #top-user .who b{display:none}
  .side{position:sticky;top:60px;height:auto;flex-direction:row;overflow-x:auto;padding:8px 16px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);z-index:10;scrollbar-width:none}
  .side a{flex:none;padding:8px 12px;font-size:13px}
  .side a svg{display:none}
  .side hr{display:none}
  .content{padding-block:18px 48px}
  .wk{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="topbar"><div class="wrap gutter" style="max-width:none">
  <a class="brand" href="index.html"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg></i>MiConsulta</a>
  <nav class="top-links" id="top-user"></nav>
</div></header>
<div id="root"><div class="auth gutter"><div class="empty">Cargando…</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="assets/common.js"></script>
<script>
(() => {
const { sb, esc, av, ic, money, MODE, DOW, fmtDay, fmtShort, fmtTime, fmtDT, pill, toast, openModal, closeModal, copy, waLink, pageUrl, slugify, norm } = PA;
const root = document.getElementById('root');
// Si el enlace del correo ya no es válido, Supabase regresa con el error en la dirección.
const linkErr = (() => {
  const h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search);
  const code = h.get('error_code') || q.get('error_code');
  if (!code) return '';
  history.replaceState(null, '', location.pathname);
  return code === 'otp_expired' || /expired|invalid/i.test(h.get('error_description') || '')
    ? 'El enlace del correo ya no es válido: puede que ya lo hayas usado o que hayas pedido otro después. Entra con tu correo y contraseña; si te pide confirmar, pide un correo nuevo.'
    : 'No pudimos completar la acción del enlace. Intenta entrar con tu correo y contraseña.';
})();
const S = { linkErr, authKnown: false, user: null, recovery: false, authMode: location.hash === '#registro' ? 'signup' : 'login',
  loaded: false, isAdmin: false, profile: null, view: 'inicio', locations: [], schedules: [], timeOff: [], appts: [], clients: [], surveys: [], links: [], notes: [],
  apptTab: 'review', week: null, builder: null, sentIds: null };
const VIEWS = { inicio: ['Inicio', 'home'], calendario: ['Calendario', 'week'], citas: ['Citas', 'cal'], horario: ['Horario', 'clock'], ubicaciones: ['Ubicaciones', 'pin'], perfil: ['Mi perfil', 'user'], pacientes: ['Pacientes', 'users'], encuestas: ['Encuestas', 'form'] };
const TOPICS = ['Ansiedad', 'Depresión', 'Pareja', 'Duelo', 'Autoestima', 'Estrés', 'Adolescentes', 'Niños', 'Familia', 'Adicciones', 'Trauma', 'Sexualidad', 'Orientación vocacional', 'TDAH'];
const SPECS = { psicologia: 'Psicología', medicina: 'Medicina general', odontologia: 'Odontología' };
const LANGS = ['Español', 'Inglés', 'Francés', 'Portugués', 'Lengua de señas mexicana'];
const QTYPES = { single: 'Una opción', multi: 'Varias opciones', scale: 'Escala del 1 al 5', freq: 'Frecuencia', text: 'Respuesta abierta' };
const QNOTE = { scale: 'El paciente elige un número del 1 (nada) al 5 (mucho).', freq: 'Opciones fijas: Nunca, Varios días, Más de la mitad de los días, Casi todos los días.', text: 'El paciente escribe su respuesta, hasta 2000 caracteres.' };
const FREQ = ['Nunca', 'Varios días', 'Más de la mitad de los días', 'Casi todos los días'];
const val = id => (document.getElementById(id)?.value || '').trim();
const setErr = (id, m) => { const e = document.getElementById(id); if (e) e.textContent = m; return false; };
const tz = () => S.profile?.timezone || PA.TZ;
const phoneKey = p => String(p || '').replace(/\D/g, '').slice(-10);
const busy = (b, on, txt) => { if (!b) return; if (on) { b.dataset.t = b.textContent; b.disabled = true; if (txt) b.textContent = txt; } else { b.disabled = false; if (b.dataset.t) b.textContent = b.dataset.t; } };

/* ---------- sesión ---------- */
if (!sb) root.innerHTML = '<div class="auth gutter"><div class="empty">No se pudo cargar la conexión.</div></div>';
else sb.auth.onAuthStateChange((ev, session) => {
  const prev = S.user && S.user.id;
  S.authKnown = true; S.user = session ? session.user : null;
  if (ev === 'PASSWORD_RECOVERY') S.recovery = true;
  if ((S.user && S.user.id) !== prev) { S.loaded = false; if (S.user) setTimeout(loadAll, 0); }
  render();
});

async function loadAll() {
  const uid = S.user.id;
  const [pr, adm, sub, st] = await Promise.all([sb.from('profiles').select('*').eq('id', uid).maybeSingle(), sb.rpc('is_admin'),
    sb.from('subscriptions').select('*').eq('user_id', uid).maybeSingle(), sb.from('platform_settings').select('admin_contact').maybeSingle()]);
  S.profile = pr.data || null; S.isAdmin = !!adm.data; S.sub = sub.data || null; S.contact = st.data?.admin_contact || '';
  if (S.profile) {
    const [l, s, t, a, c, sv, lk, nt] = await Promise.all([
      sb.from('locations').select('*').eq('owner_id', uid).order('created_at'),
      sb.from('schedules').select('*').eq('owner_id', uid).order('weekday').order('start_time'),
      sb.from('time_off').select('*').eq('owner_id', uid).order('date_from'),
      sb.from('appointments').select('*').eq('psychologist_id', uid).order('starts_at'),
      sb.from('clients').select('*').eq('owner_id', uid).order('full_name'),
      sb.from('surveys').select('*').eq('owner_id', uid).order('created_at', { ascending: false }),
      sb.from('survey_links').select('*').eq('owner_id', uid).order('created_at', { ascending: false }),
      sb.from('notifications').select('*').eq('psychologist_id', uid).order('created_at', { ascending: false }).limit(12),
    ]);
    S.locations = l.data || []; S.schedules = s.data || []; S.timeOff = t.data || []; S.appts = a.data || [];
    S.clients = c.data || []; S.surveys = sv.data || []; S.links = lk.data || []; S.notes = nt.data || [];
    S.week = null;
  }
  S.loaded = true; lastLoad = Date.now();
  const h = location.hash.slice(1); if (VIEWS[h] && !(S.view === 'paciente' && h === 'pacientes')) S.view = h;
  render();
}
// Mantiene el panel al día: al volver a la pestaña y cada minuto, sin interrumpir formularios abiertos.
let lastLoad = 0;
async function refresh() {
  if (!S.user || !S.profile || document.hidden || document.getElementById('modal')?.hidden === false) return;
  if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (['horario', 'perfil', 'paciente'].includes(S.view) || Date.now() - lastLoad < 30000) return;
  lastLoad = Date.now(); await loadAll();
}
document.addEventListener('visibilitychange', refresh);
setInterval(refresh, 60000);

window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS[h] && S.profile) { S.view = h; S.clientId = null; render(); scrollTo(0, 0); } });

function render() {
  const top = document.getElementById('top-user');
  const name = S.profile ? S.profile.full_name.split(' ')[0] : 'Mi cuenta';
  top.innerHTML = S.user ? `<span class="who small">${av(S.profile?.full_name || 'Mi cuenta', 'sm', S.profile?.photo_url)}<b>${esc(name)}</b></span><button class="btn neu sm" data-a="logout">${ic('out', 15)} Salir</button>` : `<a class="btn neu sm" href="index.html">Ir al buscador</a>`;
  if (!S.authKnown) return;
  if (S.recovery) return renderRecovery();
  if (!S.user) return renderAuth();
  if (!S.loaded) { root.innerHTML = '<div class="auth gutter"><div class="empty">Cargando tu panel…</div></div>'; return; }
  if (!hasAccess()) return renderNoAccess();
  if (!S.profile) return renderOnboarding();
  const badge = S.appts.filter(a => a.status === 'review').length;
  root.innerHTML = `<div class="app"><nav class="side" aria-label="Secciones">
      ${Object.entries(VIEWS).map(([k, [t, i]]) => `<a href="#${k}" ${S.view === k || (S.view === 'paciente' && k === 'pacientes') ? 'aria-current="page"' : ''}>${ic(i, 18)}${t}${k === 'citas' && badge ? `<span class="badge">${badge}</span>` : ''}</a>`).join('')}
      <hr><a href="perfil.html?p=${encodeURIComponent(S.profile.slug)}" target="_blank" rel="noopener">${ic('eye', 18)}Ver perfil público</a>
      ${S.isAdmin ? `<a href="admin.html">${ic('shield', 18)}Administración</a>` : ''}
    </nav><main class="content gutter"><div class="wrap">${trialBanner()}${V[S.view]()}</div></main></div>`;
  if (S.view === 'pacientes') filterClients();
}

/* ---------- acceso a la plataforma ---------- */
const accessDays = () => S.sub && S.sub.access_until ? Math.ceil((new Date(S.sub.access_until) - Date.now()) / 864e5) : -1;
const hasAccess = () => S.isAdmin || accessDays() > 0;
const contactHtml = () => S.contact ? `<div class="card pre" style="box-shadow:none;border:1px solid var(--line);background:var(--bg);font-weight:600;margin-top:12px">${esc(S.contact)}</div>` : '<p class="muted">Escríbele al administrador de MiConsulta.</p>';
function renderNoAccess() {
  const had = S.sub && S.sub.access_until;
  root.innerHTML = `<div class="auth gutter" style="max-width:560px"><div class="card"><span class="ic-box" style="margin-bottom:12px">${ic('lock')}</span>
    <h1 style="font-size:24px">${had ? 'Tu acceso a MiConsulta venció' : S.sub && S.sub.plan === 'sin_acceso' ? 'Tu acceso a MiConsulta no está activo' : 'Tu cuenta todavía no está activa'}</h1>
    <p class="muted">${had ? `Tu ${S.sub.plan === 'prueba' ? 'periodo de prueba' : 'plan'} terminó el ${new Date(S.sub.access_until).toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' })}. ` : ''}Mientras tanto tu perfil no aparece en el buscador y no puedes recibir citas ni hacer cambios. Tus datos están guardados.</p>
    <p style="margin:12px 0 0;font-weight:700">Para activar tu acceso, contacta al administrador:</p>${contactHtml()}
    <button class="btn neu" style="margin-top:16px" data-a="reload">Ya me activaron, actualizar</button></div></div>`;
}
function trialBanner() {
  if (S.isAdmin || !S.sub) return '';
  const d = accessDays();
  if (S.sub.plan === 'prueba') return `<div class="banner-acc ${d <= 3 ? 'warn' : ''}">${ic('clock', 16)}<span>Periodo de prueba: te ${d === 1 ? 'queda 1 día' : `quedan ${d} días`}. ${S.contact ? 'Para continuar, contacta al administrador: ' + esc(S.contact) : 'Para continuar, contacta al administrador.'}</span></div>`;
  if (d <= 5) return `<div class="banner-acc warn">${ic('clock', 16)}<span>Tu plan vence en ${d === 1 ? '1 día' : d + ' días'}. ${S.contact ? 'Para renovar: ' + esc(S.contact) : 'Contacta al administrador para renovar.'}</span></div>`;
  return '';
}

/* ---------- acceso ---------- */
function renderAuth() {
  const m = S.authMode;
  const T = { login: ['Entra a tu panel', 'Administra tus citas, horarios y encuestas.'], signup: ['Crea tu cuenta de especialista', 'Es gratis. Después configuras tu perfil, horarios y ubicaciones.'], forgot: ['Recupera tu contraseña', 'Te enviamos un correo con un enlace para crear una nueva.'] }[m];
  root.innerHTML = `<div class="auth gutter"><div class="card form">
    <div><h1>${T[0]}</h1><p class="muted" style="margin:0">${T[1]}</p></div>
    ${m === 'signup' ? `<label class="field"><span>Nombre completo</span><input id="au-name" autocomplete="name" placeholder="Ej. Laura Méndez Ruiz"></label>` : ''}
    <label class="field"><span>Correo</span><input id="au-email" type="email" autocomplete="email" placeholder="tu@correo.com"></label>
    ${m !== 'forgot' ? `<label class="field"><span>Contraseña</span><input id="au-pass" type="password" autocomplete="${m === 'signup' ? 'new-password' : 'current-password'}" placeholder="${m === 'signup' ? 'Mínimo 8 caracteres' : ''}"></label>` : ''}
    ${S.linkErr ? `<div class="banner-acc warn">${ic('lock', 16)}<span>${esc(S.linkErr)}</span></div>` : ''}
    <p class="err" id="au-err"></p><p class="ok-msg" id="au-ok"></p>

// Mensajes claros para los errores de acceso de Supabase
function authMsg(e) {
  const m = (e && (e.code || '') + ' ' + (e.message || '')) || '';
  if (/rate.?limit|over_email_send/i.test(m)) return 'Ya te enviamos un correo hace poco. Por seguridad hay que esperar unos minutos antes de pedir otro. Revisa tu bandeja de entrada y la carpeta de spam.';
  if (/not.?confirmed/i.test(m)) return 'Tu correo aún no está confirmado. Abre el enlace del correo que te enviamos (el más reciente) o pide uno nuevo con el botón de abajo.';
  if (/invalid.?(login|credentials)/i.test(m)) return 'Correo o contraseña incorrectos. Si no recuerdas tu contraseña, toca "Olvidé mi contraseña".';
  if (/already.?registered|already.?exists/i.test(m)) return 'Ese correo ya tiene cuenta. Entra con tu contraseña o toca "Olvidé mi contraseña".';
  if (/weak|password/i.test(m)) return 'La contraseña es muy débil. Usa al menos 8 caracteres combinando letras y números.';
  if (/fetch|network/i.test(m)) return 'No pudimos conectarnos. Revisa tu internet e intenta de nuevo.';
  return 'No se pudo completar. Intenta de nuevo en unos minutos.';
}

async function doAuth(btn) {
  const m = S.authMode, email = val('au-email'), pass = document.getElementById('au-pass')?.value || '';
  setErr('au-err', ''); setErr('au-ok', '');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return setErr('au-err', 'Escribe un correo válido.');
  const back = pageUrl('panel.html');
  busy(btn, true);
  let r;
  if (m === 'forgot') {
    r = await sb.auth.resetPasswordForEmail(email, { redirectTo: back });
    busy(btn, false);
    return r.error ? setErr('au-err', authMsg(r.error)) : setErr('au-ok', 'Listo. Si el correo está registrado, te llegará un enlace para crear tu nueva contraseña. Revisa también la carpeta de spam.');
  }
  if (m === 'signup') {
    const name = val('au-name');
    if (name.length < 3) { busy(btn, false); return setErr('au-err', 'Escribe tu nombre completo.'); }
    if (pass.length < 8) { busy(btn, false); return setErr('au-err', 'La contraseña debe tener al menos 8 caracteres.'); }
    r = await sb.auth.signUp({ email, password: pass, options: { data: { full_name: name }, emailRedirectTo: back } });
    busy(btn, false);
    if (r.error) return setErr('au-err', authMsg(r.error));
    // Supabase no devuelve error si el correo ya existe: lo indica con una cuenta sin identidades.
    if (r.data.user && Array.isArray(r.data.user.identities) && r.data.user.identities.length === 0) return setErr('au-err', authMsg({ message: 'already registered' }));
    if (!r.data.session) return setErr('au-ok', 'Cuenta creada. Te enviamos un correo para confirmarla: ábrelo y después entra aquí. Usa solo el correo más reciente y revisa la carpeta de spam.');
    return;
  }
  r = await sb.auth.signInWithPassword({ email, password: pass });
  busy(btn, false);
  if (r.error) {
    setErr('au-err', authMsg(r.error));
    const rs = document.getElementById('au-resend'); if (rs) rs.hidden = !/not.?confirmed/i.test(r.error.message || '');
  }
}

async function resendConfirm(btn) {
  const email = val('au-email');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return setErr('au-err', 'Escribe tu correo arriba.');
  busy(btn, true);
  const r = await sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: pageUrl('panel.html') } });
  busy(btn, false);
  if (r.error) return setErr('au-err', authMsg(r.error));
  setErr('au-err', ''); setErr('au-ok', 'Te enviamos un nuevo correo de confirmación. Usa ese: los anteriores dejan de funcionar.');
}

async function saveProfile(btn) {
  const creating = !S.profile;
  const row = {
    full_name: val('pf-name').replace(/\s+/g, ' '), title: val('pf-title') || null, license: val('pf-license') || null,
    bio: val('pf-bio') || null, payment_info: val('pf-pay') || null, slug: slugify(val('pf-slug')),
    price: val('pf-price') === '' ? null : Math.round(Number(val('pf-price'))),
    topics: [...document.querySelectorAll('#pf-topics [aria-pressed="true"]')].map(b => b.dataset.t),
    whatsapp: val('pf-wa') || null,
    specialty: val('pf-spec') || 'psicologia',
    gender: val('pf-gender') || null,
    languages: [...document.querySelectorAll('#pf-langs [aria-pressed="true"]')].map(b => b.dataset.t),
  };
  if (row.whatsapp && row.whatsapp.replace(/\D/g, '').length < 8) return setErr('pf-err', 'Revisa tu WhatsApp: debe tener al menos 8 dígitos.');
  if (row.full_name.length < 3) return setErr('pf-err', 'Escribe tu nombre completo.');
  if (row.slug.length < 3) return setErr('pf-err', 'La dirección del perfil debe tener al menos 3 letras o números.');
  if (row.price != null && (isNaN(row.price) || row.price < 0)) return setErr('pf-err', 'Revisa el precio.');
  if (!creating) {
    row.is_listed = document.getElementById('pf-listed').checked;
    row.notify_email = document.getElementById('pf-notify').checked;
    if (row.is_listed && (!S.schedules.length || !S.locations.length)) return setErr('pf-err', 'Para aparecer en el buscador primero configura tu horario y al menos una ubicación.');
  }
  busy(btn, true, 'Guardando…');
  const q = creating ? sb.from('profiles').insert({ id: S.user.id, ...row }) : sb.from('profiles').update(row).eq('id', S.user.id);
  const { data, error } = await q.select().single();
  busy(btn, false);
  if (error) return setErr('pf-err', /slug|unique|duplicate/i.test(error.message) ? 'Esa dirección de perfil ya está ocupada. Prueba otra.' : 'No se pudo guardar: ' + error.message);
  S.profile = data;
  if (creating) { S.view = 'inicio'; location.hash = 'inicio'; toast('Perfil creado'); }
  else toast('Perfil guardado');
  render();
}

/* Calendario semanal */
const keyAdd = (k, n) => { const d = new Date(k + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const keyDow = k => new Date(k + 'T00:00:00Z').getUTCDay();
const mondayOf = k => keyAdd(k, -((keyDow(k) + 6) % 7));
const keyLabel = (k, o) => new Date(k + 'T12:00:00Z').toLocaleDateString('es-MX', { timeZone: 'UTC', ...o });
const toMin = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);
const localMin = iso => toMin(new Date(iso).toLocaleTimeString('en-GB', { timeZone: tz(), hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }));

V.calendario = () => {
  const today = PA.todayKey(tz()); if (!S.calStart) S.calStart = mondayOf(today);
  const days = [...Array(7)].map((_, i) => keyAdd(S.calStart, i));
  const ACTIVE = ['unpaid', 'review', 'confirmed'];
  const ev = S.appts.filter(a => ACTIVE.includes(a.status) && days.includes(PA.dayKey(a.starts_at, tz())));
  const mins = [...S.schedules.map(s => toMin(s.start_time)), ...ev.map(a => localMin(a.starts_at))];
  const maxs = [...S.schedules.map(s => toMin(s.end_time)), ...ev.map(a => localMin(a.ends_at) || 1440)];
  const h0 = Math.floor((mins.length ? Math.min(...mins) : 8 * 60) / 60), h1 = Math.min(24, Math.ceil((maxs.length ? Math.max(...maxs) : 20 * 60) / 60));
  const HP = 54, px = m => (m - h0 * 60) / 60 * HP, H = (h1 - h0) * HP;
  const offOf = k => S.timeOff.find(t => k >= t.date_from && k <= t.date_to);
  const evHtml = (a, pos) => { const t0 = localMin(a.starts_at), t1 = localMin(a.ends_at) || 1440;
    return `<button class="ev s-${a.status}" data-a="calAppt" data-id="${a.id}" ${pos ? `style="top:${px(t0)}px;height:${Math.max(px(t1) - px(t0) - 2, 22)}px"` : ''}><b>${esc(a.patient_name)}</b>${fmtTime(a.starts_at, tz())} · ${a.location_id ? esc(locName(a.location_id)) : MODE[a.mode]}</button>`; };
  const nowMin = localMin(new Date().toISOString());
  const title = `${keyLabel(days[0], { day: 'numeric', month: 'short' })} – ${keyLabel(days[6], { day: 'numeric', month: 'short', year: 'numeric' })}`;
  return `<div class="title-row"><h1>Calendario</h1></div>
    <div class="cal-bar"><h2>${title}</h2><button class="btn neu sm" data-a="calMove" data-d="-7" aria-label="Semana anterior">‹ Anterior</button><button class="btn neu sm" data-a="calMove" data-d="0">Hoy</button><button class="btn neu sm" data-a="calMove" data-d="7" aria-label="Semana siguiente">Siguiente ›</button></div>
    <div class="legend">${S.locations.map(l => `<span><i style="background:${locColor(l.id)};opacity:.5"></i>${esc(l.name)}</span>`).join('')}<span><i style="background:var(--ok);"></i>Confirmada</span><span><i style="background:var(--calm)"></i>Pago por revisar</span><span><i style="background:var(--warn)"></i>Sin pago</span><span><i style="background:repeating-linear-gradient(135deg,var(--bg) 0 3px,var(--line) 3px 4px)"></i>Descanso</span></div>
    <div class="cal"><div class="cal-grid" style="--hp:${HP}px">
      <div></div>${days.map(k => `<div class="cal-h ${k === today ? 'today' : ''}">${keyLabel(k, { weekday: 'short', day: 'numeric' })}</div>`).join('')}
      <div class="cal-times" style="height:${H}px">${[...Array(h1 - h0)].map((_, i) => `<span style="top:${i * HP + (i ? 0 : 8)}px">${String(h0 + i).padStart(2, '0')}:00</span>`).join('')}</div>
      ${days.map(k => { const off = offOf(k);
        return `<div class="cal-col ${off ? 'off' : ''}" style="height:${H}px">
          ${off ? `<span class="off-l">Descanso${off.reason ? ' · ' + esc(off.reason) : ''}</span>` : S.schedules.filter(s => s.weekday === keyDow(k)).map(s => `<div class="band" title="${esc(locName(s.location_id))}" style="--lc:${locColor(s.location_id)};top:${px(toMin(s.start_time))}px;height:${px(toMin(s.end_time)) - px(toMin(s.start_time))}px"><span>${esc(locName(s.location_id))}</span></div>`).join('')}
          ${ev.filter(a => PA.dayKey(a.starts_at, tz()) === k).map(a => evHtml(a, true)).join('')}
          ${k === today && nowMin >= h0 * 60 && nowMin <= h1 * 60 ? `<div class="now" style="top:${px(nowMin)}px"></div>` : ''}</div>`; }).join('')}
    </div></div>
    <div class="cal-list">${days.map(k => { const off = offOf(k), sch = S.schedules.filter(s => s.weekday === keyDow(k)), list = ev.filter(a => PA.dayKey(a.starts_at, tz()) === k);
      return `<section class="card cal-day"><h4 style="${k === today ? 'color:var(--accent)' : ''}">${PA.cap(keyLabel(k, { weekday: 'long', day: 'numeric', month: 'long' }))}</h4>
        <div class="muted small">${off ? 'Descanso' + (off.reason ? ' · ' + esc(off.reason) : '') : sch.length ? 'Atiendes ' + sch.map(s => s.start_time.slice(0, 5) + '–' + s.end_time.slice(0, 5) + ' en ' + esc(locName(s.location_id))).join(', ') : 'Sin horario'}</div>
        ${list.map(a => evHtml(a, false)).join('')}</section>`; }).join('')}</div>`;
};

/* Citas */
V.citas = () => {

  const TABS = {
    review: ['Por revisar', a => a.status === 'review'],

  if (S.apptTab === 'history') list.reverse();

  return S.week;
}

const LOC_COLORS = ['#1f9a70', '#5162e0', '#e8743b', '#c74f8e', '#b88a12', '#7a58ea'];
const locColor = id => { const i = S.locations.findIndex(l => l.id === id); return i < 0 ? '#8a88a3' : LOC_COLORS[i % LOC_COLORS.length]; };
const locName = id => { const l = S.locations.find(x => x.id === id); return l ? l.name : 'sin ubicación'; };
// Rangos que se cruzan en el mismo día, aunque sean de ubicaciones distintas
function clashes(W) {
  const bad = new Set(), msgs = [];
  for (const d of Object.keys(W)) {
    const rs = W[d].map((r, i) => ({ ...r, i })).filter(r => r.start && r.end).sort((a, b) => a.start.localeCompare(b.start));
    for (let j = 1; j < rs.length; j++) for (let k = 0; k < j; k++) {
      const a = rs[k], b = rs[j];
      if (b.start < a.end && a.start < b.end) {
        bad.add(d + '-' + a.i); bad.add(d + '-' + b.i);
        msgs.push(a.loc === b.loc
          ? `El ${DOW[d].toLowerCase()}, ${a.start}–${a.end} y ${b.start}–${b.end} en ${locName(a.loc)} se enciman.`
          : `El ${DOW[d].toLowerCase()}, ${a.start}–${a.end} en ${locName(a.loc)} se cruza con ${b.start}–${b.end} en ${locName(b.loc)}. No puedes estar en dos lugares a la vez.`);
      }
    }
  }
  return { bad, msgs };
}
function showClashes() {
  const { bad, msgs } = clashes(weekState());
  document.querySelectorAll('.rng[data-k]').forEach(r => r.classList.toggle('clash', bad.has(r.dataset.k)));
  const e = document.getElementById('hr-clash'); if (e) e.textContent = msgs.join(' ');
}

async function saveSession(btn) {
  busy(btn, true);
  const { data, error } = await sb.from('profiles').update({ session_minutes: +val('hr-dur'), slot_minutes: +val('hr-step'), min_notice_hours: +val('hr-notice') }).eq('id', S.user.id).select().single();
  busy(btn, false);
  if (error) return setErr('hr-err1', 'No se pudo guardar.');
  S.profile = data; toast('Ajustes de sesión guardados');
}

async function saveWeek(btn) {
  const W = weekState(), rows = [];
  for (const d of Object.keys(W)) {
    for (const r of W[d]) {
      if (!r.start || !r.end || r.end <= r.start) return setErr('hr-err2', `Revisa el horario del ${DOW[d].toLowerCase()}: la hora final debe ser después de la inicial.`);
      if (!r.loc) return setErr('hr-err2', `Elige la ubicación de cada horario del ${DOW[d].toLowerCase()}.`);
      rows.push({ weekday: +d, start_time: r.start, end_time: r.end, location_id: r.loc });
    }
  }
  const { msgs } = clashes(W);
  if (msgs.length) { showClashes(); return setErr('hr-err2', 'No se guardó: corrige los horarios que se cruzan (marcados en rojo).'); }
  setErr('hr-err2', ''); busy(btn, true, 'Guardando…');
  const { data, error } = await sb.rpc('save_schedule', { p_rows: rows });
  busy(btn, false);
  if (error) return setErr('hr-err2', error.code === '23P01' ? 'No se guardó: hay horarios que se cruzan.' : 'No se pudo guardar el horario. Intenta de nuevo; tu horario anterior sigue igual.');
  S.schedules = data; S.week = null; render(); toast('Horario guardado');
}

async function addOff(btn) {

  if (to < from) return setErr('to-err', 'La fecha final debe ser igual o posterior a la inicial.');

  busy(btn, false);
  if (error) return setErr('to-err', 'No se pudo guardar.');
  S.timeOff = [...S.timeOff, data].sort((a, b) => a.date_from.localeCompare(b.date_from)); render(); toast('Descanso agregado');
}

const LM = { map: null, marker: null, lat: null, lng: null, touched: false };
function setPin(lat, lng, zoom, auto) {
  LM.lat = lat; LM.lng = lng; if (!auto) LM.touched = true;
  if (!LM.map) return;
  if (LM.marker) LM.marker.setLatLng([lat, lng]);
  else { LM.marker = L.marker([lat, lng], { draggable: true }).addTo(LM.map); LM.marker.on('dragend', e => { const p = e.target.getLatLng(); setPin(p.lat, p.lng); }); }
  if (zoom) LM.map.setView([lat, lng], zoom);
  const t = document.getElementById('lc-pin'); if (t) t.textContent = 'Ubicación marcada. Puedes arrastrar el marcador para ajustarla.';
}
function initLocMap(l) {
  Object.assign(LM, { map: null, marker: null, lat: l.lat ?? null, lng: l.lng ?? null, touched: false, orig: l, linkUrl: l.maps_url || null });
  if (!window.L) { document.getElementById('lc-map').innerHTML = '<div class="empty">No se pudo cargar el mapa.</div>'; return; }
  LM.map = L.map('lc-map').setView(l.lat != null ? [l.lat, l.lng] : [19.4326, -99.1332], l.lat != null ? 16 : 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(LM.map);
  if (l.lat != null) setPin(l.lat, l.lng, 0, true);
  LM.map.on('click', e => setPin(e.latlng.lat, e.latlng.lng));
  setTimeout(() => LM.map && LM.map.invalidateSize(), 150);
}
async function resolveGmaps(url) {
  const m = decodeURIComponent(url).match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || decodeURIComponent(url).match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { lat: +m[1], lng: +m[2] };
  const { data, error } = await sb.functions.invoke('maps-link', { body: { url } });
  return !error && data && data.ok ? { lat: data.lat, lng: data.lng } : null;
}
async function useGmaps(btn) {
  const url = val('lc-gmaps');
  if (!PA.MAPS_RE.test(url)) return setErr('lc-err', 'Pega un enlace de Google Maps (empieza con https://maps.app.goo.gl o https://www.google.com/maps).');
  busy(btn, true, 'Leyendo el enlace…');
  const hit = await resolveGmaps(url); busy(btn, false);
  if (!hit) return setErr('lc-err', 'No pudimos leer la ubicación de ese enlace. Revisa que sea el de Compartir del lugar, o ubícala tocando el mapa.');
  setErr('lc-err', ''); LM.linkUrl = url; setPin(hit.lat, hit.lng, 17);
}
async function geocode(btn) {
  const q = [val('lc-addr'), val('lc-city'), 'México'].filter(Boolean).join(', ');
  if (!val('lc-addr') && !val('lc-city')) return setErr('lc-err', 'Escribe la dirección y la ciudad primero.');
  busy(btn, true, 'Buscando…');
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=mx&accept-language=es&q=' + encodeURIComponent(q));
    const j = await r.json(); busy(btn, false);
    if (!j.length) return setErr('lc-err', 'No encontramos esa dirección. Ubícala tocando el mapa.');
    setErr('lc-err', ''); setPin(+j[0].lat, +j[0].lon, 17);
  } catch (e) { busy(btn, false); setErr('lc-err', 'No se pudo buscar la dirección. Ubícala tocando el mapa.'); }
}

async function saveLoc(id, btn) {
  const kind = val('lc-kind'), row = { kind, name: val('lc-name'), address: kind === 'presencial' ? val('lc-addr') || null : null, city: kind === 'presencial' ? val('lc-city') || null : null,
    lat: kind === 'presencial' ? LM.lat : null, lng: kind === 'presencial' ? LM.lng : null };
  const gm = kind === 'presencial' ? val('lc-gmaps') : '';
  if (gm && !PA.MAPS_RE.test(gm)) return setErr('lc-err', 'El enlace de Google Maps no es válido.');
  row.maps_url = gm || null;
  if (gm && gm !== LM.linkUrl) { busy(btn, true, 'Leyendo el enlace…'); const hit = await resolveGmaps(gm); busy(btn, false); if (hit) { LM.linkUrl = gm; setPin(hit.lat, hit.lng); row.lat = hit.lat; row.lng = hit.lng; } }
  // Si cambió la dirección y no se movió el marcador, se borra la ubicación vieja para que se ubique sola.
  if (kind === 'presencial' && !LM.touched && LM.orig && (row.address !== (LM.orig.address || null) || row.city !== (LM.orig.city || null))) { row.lat = null; row.lng = null; }
  if (row.name.length < 2) return setErr('lc-err', 'Escribe un nombre para la ubicación.');

  busy(btn, true);

  busy(btn, false);
  if (error) return setErr('lc-err', 'No se pudo guardar.');
  S.locations = id ? S.locations.map(l => l.id === id ? data : l) : [...S.locations, data];

async function saveClient(id, btn) {
  const name = val('cl-name').replace(/\s+/g, ' '), email = val('cl-email'), phone = val('cl-phone'), d = phone.replace(/\D/g, '');
  if (name.length < 2) return setErr('cl-err', 'Escribe el nombre completo.');
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return setErr('cl-err', 'El correo no es válido.');
  if (d.length < 8 || d.length > 15) return setErr('cl-err', 'El teléfono debe tener entre 8 y 15 dígitos.');
  if (S.clients.some(c => c.id !== id && phoneKey(c.phone) === phoneKey(phone))) return setErr('cl-err', 'Ya tienes un paciente con ese teléfono.');
  busy(btn, true, 'Guardando…');
  const row = { full_name: name, email: email || null, phone, birth_date: val('cl-birth') || null, sex: val('cl-sex') || null, occupation: val('cl-occ') || null,
    address: val('cl-addr') || null, emergency_name: val('cl-ename') || null, emergency_phone: val('cl-ephone') || null, source: val('cl-source') || null,
    source_detail: val('cl-sdetail') || null, status: val('cl-status') || 'activo', notes: val('cl-notes') || null };
  const { data, error } = await (id ? sb.from('clients').update(row).eq('id', id) : sb.from('clients').insert(row)).select().single();
  busy(btn, false);
  if (error) return setErr('cl-err', /duplicate|unique/i.test(error.message) ? 'Ya tienes un paciente con ese teléfono.' : 'No se pudo guardar.');
  S.clients = (id ? S.clients.map(c => c.id === id ? data : c) : [...S.clients, data]).sort((a, b) => a.full_name.localeCompare(b.full_name));
  closeModal();
  if (id) { render(); toast('Datos guardados'); } else { toast(`${name} agregado`); openClient(data.id); }
}

async function openClient(id) {
  S.view = 'paciente'; S.clientId = id; S.pTab = S.pTab && S.clientId === id ? S.pTab : 'datos'; S.rec = null; S.cnotes = null;
  if (location.hash !== '#pacientes') history.replaceState(null, '', '#pacientes');
  render(); scrollTo(0, 0);
  const [r, n] = await Promise.all([sb.from('clinical_records').select('*').eq('client_id', id).maybeSingle(), sb.from('clinical_notes').select('*').eq('client_id', id).order('note_date', { ascending: false }).order('created_at', { ascending: false })]);
  if (S.clientId !== id) return;
  S.rec = r.data || { client_id: id, fields: {} }; S.cnotes = n.data || [];
  if (S.view === 'paciente') render();
}

      : g.items.map(([l, k]) => `<label class="field"><span>${l}</span><textarea data-rec="${k}" maxlength="6000" rows="3">${esc(f[k] || '')}</textarea></label>`).join('')).join('')}

async function saveRecord(btn) {
  const fields = {};
  document.querySelectorAll('[data-rec]').forEach(el => { const v = el.value.trim(); if (v) fields[el.dataset.rec] = v; });
  busy(btn, true, 'Guardando…');
  const { data, error } = await sb.from('clinical_records').upsert({ client_id: S.clientId, fields, updated_at: new Date().toISOString() }, { onConflict: 'client_id' }).select().single();
  busy(btn, false);
  if (error) return setErr('rec-err', 'No se pudo guardar el expediente.');
  S.rec = data; render(); toast('Expediente guardado');
}

async function addNote(btn) {
  const content = val('nt-text');
  if (!content) return setErr('nt-err', 'Escribe la nota.');
  busy(btn, true);
  const { data, error } = await sb.from('clinical_notes').insert({ client_id: S.clientId, note_date: val('nt-date') || PA.todayKey(tz()), kind: val('nt-kind'), content }).select().single();
  busy(btn, false);
  if (error) return setErr('nt-err', 'No se pudo guardar la nota.');
  S.cnotes = [data, ...S.cnotes].sort((a, b) => b.note_date.localeCompare(a.note_date)); render(); toast('Nota agregada');
}

function sendToModal(cid) {
  const c = S.clients.find(x => x.id === cid);

async function createLinkFor(cid, btn) {
  const sid = val('st-survey');
  if (S.links.some(l => l.survey_id === sid && l.client_id === cid && l.status === 'sent')) return setErr('st-err', 'Ya tiene esta encuesta pendiente. Puedes reenviarle el mismo link desde la pestaña Encuestas.');
  busy(btn, true);
  const { data, error } = await sb.from('survey_links').insert({ survey_id: sid, client_id: cid }).select().single();
  busy(btn, false);
  if (error) return setErr('st-err', 'No se pudo crear el link.');
  S.links = [data, ...S.links];
  openModal(`<h3>Link listo</h3><p class="sub">Mándaselo por WhatsApp, correo o cópialo.</p>${linkRow(data, S.surveys.find(s => s.id === sid))}<button class="btn neu big" data-close>Listo</button>`);
  if (S.view === 'paciente') { S.pTab = 'encuestas'; render(); }
}

// Link abierto: cualquiera con el link contesta y se registra como paciente
function publicLinkModal(id) {
  const sv = S.surveys.find(s => s.id === id), url = sv.public_token ? pageUrl('responder.html?s=' + sv.public_token) : '';
  openModal(`<h3>Link abierto · ${esc(sv.title)}</h3><p class="sub">Para personas que todavía no son tus pacientes. Quien lo abra escribe su nombre y teléfono, contesta, y queda registrado en tus Pacientes con origen "Encuesta". Si ese teléfono ya es tu paciente, la respuesta se agrega a su expediente.</p>
    ${sv.public_token ? `<div class="lnk"><div><b>Link para compartir</b><div class="mono" id="pub-l">${esc(url)}</div></div><div class="acts">
        <button class="btn neu sm" data-a="copy" data-u="${esc(url)}" data-el="pub-l">Copiar</button>
        <a class="btn sec sm" href="https://wa.me/?text=${encodeURIComponent(`Te comparto esta encuesta de ${S.profile.full_name}: ${url}`)}" target="_blank" rel="noopener">WhatsApp</a></div></div>
      <button class="btn danger" style="margin-top:10px" data-a="togglePublic" data-id="${id}" data-on="0">Desactivar link abierto</button>`
      : `<button class="btn pri big" data-a="togglePublic" data-id="${id}" data-on="1">Crear link abierto</button>`}`);
}
async function togglePublic(id, on, btn) {
  const tok = on ? [...crypto.getRandomValues(new Uint8Array(18))].map(b => b.toString(16).padStart(2, '0')).join('') : null;
  busy(btn, true);
  const { data, error } = await sb.from('surveys').update({ public_token: tok }).eq('id', id).select().single();
  busy(btn, false);
  if (error) return toast('No se pudo cambiar el link.');
  S.surveys = S.surveys.map(s => s.id === id ? data : s); publicLinkModal(id); render(); toast(on ? 'Link abierto creado' : 'Link abierto desactivado');
}

/* Encuestas */
V.encuestas = () => `<div class="title-row"><h1>Encuestas</h1><div class="acts"><button class="btn neu sm" data-a="reload">Actualizar</button><button class="btn pri" data-a="newSurvey">+ Nueva encuesta</button></div></div>
  <div class="grid">${S.surveys.map(s => { const ls = S.links.filter(l => l.survey_id === s.id), done = ls.filter(l => l.status === 'done').length;
    return `<article class="card stack" style="gap:10px"><div class="who"><span class="ic-box">${ic('form')}</span><div><b>${esc(s.title)}</b><small>${s.questions.length} pregunta${s.questions.length === 1 ? '' : 's'}${s.description ? ' · ' + esc(s.description) : ''}</small></div></div>
      <div class="tags">${[...new Set(s.questions.map(q => QTYPES[q.type]))].map(k => `<span class="tag">${k}</span>`).join('')}</div>

const newQ = (type = 'single') => ({ text: '', type, options: type === 'single' || type === 'multi' ? ['', ''] : [], required: true });
function builderHtml() {
  const B = S.builder, n = B.questions.length;
  return `<h3>Nueva encuesta</h3><p class="sub">Agrega todas las preguntas que necesites. Cada una tiene su propio tipo de respuesta.</p><div class="form">
    <label class="field"><span>Título</span><input id="sv-title" data-b="title" value="${esc(B.title)}" placeholder="Ej. Evaluación inicial"></label>
    <label class="field"><span>Descripción (opcional)</span><input id="sv-desc" data-b="description" value="${esc(B.description)}" placeholder="Ej. Te tomará unos 5 minutos"></label>
    <div>${B.questions.map((q, i) => `<div class="qb">
      <div class="qb-h"><b>Pregunta ${i + 1}</b><span class="qb-tools">
        <button class="mini-btn" data-a="qMove" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
        <button class="mini-btn" data-a="qMove" data-i="${i}" data-d="1" ${i === n - 1 ? 'disabled' : ''} aria-label="Bajar">↓</button>
        <button class="mini-btn" data-a="qDup" data-i="${i}" aria-label="Duplicar">⧉</button>
        <button class="mini-btn bad" data-a="qDel" data-i="${i}" ${n === 1 ? 'disabled' : ''} aria-label="Eliminar">✕</button></span></div>
      <input class="in" id="q-${i}-text" data-b="text" data-i="${i}" value="${esc(q.text)}" placeholder="Escribe la pregunta" aria-label="Texto de la pregunta ${i + 1}">
      <div class="qb-row"><select class="in" data-b="type" data-i="${i}" aria-label="Tipo de respuesta">${Object.entries(QTYPES).map(([k, v]) => `<option value="${k}" ${q.type === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <label class="check"><input type="checkbox" data-b="required" data-i="${i}" ${q.required ? 'checked' : ''}> Obligatoria</label></div>
      ${q.type === 'single' || q.type === 'multi' ? `<div class="stack" style="gap:6px">${q.options.map((o, j) => `<div class="opt-row"><span class="mark ${q.type}"></span><input class="in" id="q-${i}-o-${j}" data-b="opt" data-i="${i}" data-j="${j}" value="${esc(o)}" placeholder="Opción ${j + 1}"><button class="mini-btn" data-a="optDel" data-i="${i}" data-j="${j}" ${q.options.length <= 2 ? 'disabled' : ''} aria-label="Quitar opción">✕</button></div>`).join('')}
        <button class="link" style="align-self:flex-start" data-a="optAdd" data-i="${i}">+ Agregar opción</button></div>` : `<p class="muted small" style="margin:0">${QNOTE[q.type]}</p>`}</div>`).join('')}</div>
    <div class="chips">${Object.entries(QTYPES).map(([k, v]) => `<button class="chip" data-a="qAdd" data-t="${k}">+ ${v}</button>`).join('')}</div>
    <p class="err" id="sv-err"></p><button class="btn pri big" data-a="saveSurvey">Guardar encuesta</button></div>`;
}
function redrawBuilder(focusId) { openModal(builderHtml(), true); if (focusId) { const e = document.getElementById(focusId); if (e) { e.focus(); e.scrollIntoView({ block: 'center' }); } } }
function syncBuilder(el) {
  const B = S.builder, i = +el.dataset.i, f = el.dataset.b;
  if (f === 'title' || f === 'description') B[f] = el.value;
  else if (f === 'text') B.questions[i].text = el.value;
  else if (f === 'required') B.questions[i].required = el.checked;
  else if (f === 'opt') B.questions[i].options[+el.dataset.j] = el.value;
  else if (f === 'type') { const q = B.questions[i]; q.type = el.value; if ((q.type === 'single' || q.type === 'multi') && q.options.length < 2) q.options = ['', '']; redrawBuilder(); }
}
async function saveSurvey(btn) {
  const B = S.builder, title = B.title.trim(), questions = [];
  if (title.length < 2) return setErr('sv-err', 'Escribe el título de la encuesta.');
  for (let i = 0; i < B.questions.length; i++) {
    const q = B.questions[i], text = q.text.trim();
    if (!text) return setErr('sv-err', `Escribe el texto de la pregunta ${i + 1}.`);
    const o = { text, type: q.type, required: q.required };
    if (q.type === 'single' || q.type === 'multi') { o.options = [...new Set(q.options.map(x => x.trim()).filter(Boolean))]; if (o.options.length < 2) return setErr('sv-err', `La pregunta ${i + 1} necesita al menos 2 opciones distintas.`); }
    questions.push(o);
  }
  busy(btn, true, 'Guardando…');
  const { data, error } = await sb.from('surveys').insert({ title, description: B.description.trim() || null, questions }).select().single();
  busy(btn, false);
  if (error) return setErr('sv-err', 'No se pudo guardar la encuesta.');
  S.surveys.unshift(data); S.builder = null; render(); sendModal(data.id); toast('Encuesta guardada. Elige a quién mandarle el link.');
}
function linkRow(l, sv) {
  const c = S.clients.find(x => x.id === l.client_id); if (!c) return '';
  const url = pageUrl('responder.html?t=' + l.token);
  const msg = `Hola ${c.full_name.split(' ')[0]}, te comparto la encuesta "${sv.title}". Al abrirla te pediremos tu número de teléfono para confirmar que eres tú: ${url}`;
  return `<div class="lnk">${av(c.full_name, 'sm')}<div><b>${esc(c.full_name)}</b><div class="mono" id="u-${l.id}">${esc(url)}</div></div><div class="acts">
    <button class="btn neu sm" data-a="copy" data-u="${esc(url)}" data-el="u-${l.id}">Copiar</button><a class="btn sec sm" href="${esc(waLink(c.phone, msg))}" target="_blank" rel="noopener">WhatsApp</a>
    ${c.email ? `<a class="btn neu sm" href="mailto:${esc(c.email)}?subject=${encodeURIComponent(sv.title)}&body=${encodeURIComponent(msg)}">Correo</a>` : ''}</div></div>`;
}
function sendModal(id) {
  const sv = S.surveys.find(s => s.id === id);
  if (S.sentIds) return openModal(`<h3>Links listos</h3><p class="sub">Cada link es personal: solo se abre con el teléfono registrado del paciente y se contesta una vez.</p>${S.links.filter(l => S.sentIds.includes(l.id)).map(l => linkRow(l, sv)).join('')}<button class="btn neu big" data-close>Listo</button>`);
  if (!S.clients.length) return openModal(`<h3>Enviar “${esc(sv.title)}”</h3><div class="empty">Primero agrega pacientes con su teléfono.</div><a class="btn pri big" style="margin-top:12px" href="#pacientes" data-close>Ir a Pacientes</a>`);
  openModal(`<h3>Enviar “${esc(sv.title)}”</h3><p class="sub">Se crea un link personal para cada paciente. Después lo mandas por WhatsApp, correo o lo copias.</p><div class="stack" style="gap:8px">
    ${S.clients.map(c => { const pend = S.links.some(l => l.survey_id === sv.id && l.client_id === c.id && l.status === 'sent');
      return `<label class="check card" style="box-shadow:none;padding:10px 12px"><input type="checkbox" class="snd" value="${c.id}" ${pend ? 'disabled' : ''}>${av(c.full_name, 'sm')}<span style="flex:1;min-width:0">${esc(c.full_name)}<small class="muted" style="display:block;font-weight:500">${esc(c.phone)}</small></span>${pend ? '<small class="muted">Ya tiene link pendiente</small>' : ''}</label>`; }).join('')}</div>
    <p class="err" id="snd-err" style="margin-top:10px"></p><button class="btn pri big" style="margin-top:10px" data-a="createLinks" data-id="${sv.id}">Crear links</button>`);
}
async function createLinks(id, btn) {
  const ids = [...document.querySelectorAll('.modal .snd:checked')].map(i => i.value);
  if (!ids.length) return setErr('snd-err', 'Selecciona al menos un paciente.');
  busy(btn, true);
  const { data, error } = await sb.from('survey_links').insert(ids.map(client_id => ({ survey_id: id, client_id }))).select();
  busy(btn, false);
  if (error) return setErr('snd-err', 'No se pudieron crear los links.');
  S.links = [...data, ...S.links]; S.sentIds = data.map(l => l.id); sendModal(id); S.sentIds = null; render();
}
function fmtAns(q, a) {
  if (a == null || a === '' || (Array.isArray(a) && !a.length)) return '—';
  if (q.type === 'multi') return a.map(esc).join(', ');
  if (q.type === 'scale') return a + ' / 5';
  if (q.type === 'freq') return FREQ[a];
  return esc(a);
}
function resultsModal(id) {
  const sv = S.surveys.find(s => s.id === id), ls = S.links.filter(l => l.survey_id === id), done = ls.filter(l => l.status === 'done'), pend = ls.filter(l => l.status === 'sent');
  const score = ans => sv.questions.reduce((acc, q, i) => { if (typeof ans[i] === 'number') { acc.v += ans[i]; acc.max += q.type === 'freq' ? 3 : 5; } return acc; }, { v: 0, max: 0 });
  openModal(`<h3>${esc(sv.title)}</h3><p class="sub">${done.length} de ${ls.length} respondidas. El puntaje suma escalas y frecuencias; es orientativo.</p>
    ${done.map(l => { const sc = score(l.answers); return `<div class="card" style="margin-bottom:10px;box-shadow:none"><div class="who">${av(l.respondent_name)}<div style="flex:1"><b>${esc(l.respondent_name)}</b><small>${esc(l.respondent_phone)} · ${fmtDT(l.answered_at, tz())}</small></div>${sc.max ? `<span class="pill p-calm">${sc.v}/${sc.max}</span>` : ''}</div>
      <ul class="ans">${sv.questions.map((q, i) => `<li><span>${i + 1}. ${esc(q.text)}</span><b>${fmtAns(q, l.answers[i])}</b></li>`).join('')}</ul></div>`; }).join('') || '<div class="empty">Aún no hay respuestas.</div>'}
    ${pend.length ? `<h4 style="margin:16px 0 8px">Sin responder (${pend.length})</h4>${pend.map(l => linkRow(l, sv)).join('')}` : ''}`, true);
}

/* Foto de perfil */
function squareJpeg(file, size = 512) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
const photoPath = u => u ? decodeURIComponent(u.split('/object/public/avatars/')[1] || '').split('?')[0] : '';
async function setPhoto(url) {
  const old = photoPath(S.profile.photo_url);
  const { data, error } = await sb.from('profiles').update({ photo_url: url }).eq('id', S.user.id).select().single();
  if (error) return setErr('ph-err', 'No se pudo guardar la foto.');
  S.profile = data;
  if (old) await sb.storage.from('avatars').remove([old]);
  render(); toast(url ? 'Foto actualizada' : 'Foto quitada');
}
async function uploadPhoto(f) {
  if (!f.type.startsWith('image/')) return setErr('ph-err', 'El archivo debe ser una imagen.');
  setErr('ph-err', ''); document.getElementById('pf-photo').style.opacity = .5;
  try {
    const blob = await squareJpeg(f), path = `${S.user.id}/${Date.now()}.jpg`;
    const up = await sb.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg' });
    if (up.error) throw up.error;
    await setPhoto(sb.storage.from('avatars').getPublicUrl(path).data.publicUrl);
  } catch (e) { document.getElementById('pf-photo').style.opacity = 1; setErr('ph-err', 'No se pudo subir la foto. Prueba con otra imagen.'); }
}

/* ---------- eventos ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.b && S.builder) syncBuilder(t);
  if (t.dataset.w) { weekState()[t.dataset.w][+t.dataset.i][t.dataset.f] = t.value || null; if (t.dataset.f === 'loc') t.closest('.rng').style.setProperty('--lc', locColor(t.value)); showClashes(); }
  if (t.id === 'cl-q') filterClients();
  if (t.id === 'pf-slug') updateSlugUrl();
});
document.addEventListener('change', e => {
  if (e.target.dataset.b && S.builder && e.target.type !== 'text') syncBuilder(e.target);
  if (e.target.id === 'pf-file' && e.target.files[0]) uploadPhoto(e.target.files[0]);
  if (e.target.id === 'cl-source') document.getElementById('cl-sdl').textContent = { empresa: 'Nombre de la empresa', referido: 'Quién lo recomendó' }[e.target.value] || 'Detalle (empresa, persona o campaña)';
  if (e.target.id === 'lc-kind') { document.getElementById('lc-mapwrap').hidden = e.target.value !== 'presencial'; if (LM.map) setTimeout(() => LM.map.invalidateSize(), 50); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'pf-topic-new') {
    e.preventDefault(); const t = e.target.value.trim(); if (!t) return;
    const box = document.getElementById('pf-topics'), ex = [...box.children].find(b => norm(b.dataset.t) === norm(t));
    if (ex) ex.setAttribute('aria-pressed', 'true'); else box.insertAdjacentHTML('beforeend', `<button type="button" data-a="topic" data-t="${esc(t)}" aria-pressed="true">${esc(t)}</button>`);
    e.target.value = '';
  }
});

document.addEventListener('click', async e => {
  const nav = e.target.closest('.side a[href^="#"], .back-link');
  if (nav && nav.getAttribute('href') === location.hash && S.view === 'paciente') { e.preventDefault(); S.view = location.hash.slice(1); S.clientId = null; render(); scrollTo(0, 0); return; }
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const d = el.dataset;
  switch (d.a) {
    case 'logout': await sb.auth.signOut(); S.recovery = false; location.hash = ''; break;
    case 'authMode': S.authMode = d.m; render(); break;
    case 'auth': doAuth(el); break;
    case 'resend': resendConfirm(el); break;
    case 'setPass': {
      const a = document.getElementById('rc-1').value, b = document.getElementById('rc-2').value;
      if (a.length < 8) return setErr('rc-err', 'La contraseña debe tener al menos 8 caracteres.');
      if (a !== b) return setErr('rc-err', 'Las contraseñas no coinciden.');
      busy(el, true); const r = await sb.auth.updateUser({ password: a }); busy(el, false);
      if (r.error) return setErr('rc-err', 'No se pudo guardar: ' + r.error.message);
      S.recovery = false; toast('Contraseña actualizada'); render(); break;
    }
    case 'reload': await loadAll(); toast('Datos actualizados'); break;
    case 'topic': el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') !== 'true'); break;
    case 'saveProfile': saveProfile(el); break;
    case 'delPhoto': setPhoto(null); break;
    case 'copy': PA.copy(d.u, document.getElementById(d.el)); break;
    case 'apptTab': S.apptTab = d.t; render(); break;
    case 'calMove': S.calStart = +d.d ? keyAdd(S.calStart, +d.d) : mondayOf(PA.todayKey(tz())); render(); break;
    case 'calAppt': openModal(apptCard(S.appts.find(a => a.id === d.id))); break;
    case 'setStatus': setStatus(d.id, d.s, el); break;
    case 'receipt': showReceipt(d.id); break;
    case 'saveSession': saveSession(el); break;
    case 'wkAdd': { const W = weekState()[d.d], last = W[W.length - 1], loc = last ? last.loc : S.locations[0]?.id || null;
      W.push(last ? { start: last.end, end: last.end < '20:00' ? String(+last.end.slice(0, 2) + 2).padStart(2, '0') + last.end.slice(2) : '21:00', loc } : { start: '09:00', end: '14:00', loc }); render(); showClashes(); break; }
    case 'wkDel': weekState()[d.d].splice(+d.i, 1); render(); showClashes(); break;
    case 'saveWeek': saveWeek(el); break;
    case 'addOff': addOff(el); break;
    case 'delOff': { busy(el, true); const r = await sb.from('time_off').delete().eq('id', d.id); if (r.error) { busy(el, false); return toast('No se pudo quitar.'); } S.timeOff = S.timeOff.filter(t => t.id !== d.id); render(); toast('Descanso quitado'); break; }
    case 'locForm': locForm(d.id); break;
    case 'saveLoc': saveLoc(d.id, el); break;
    case 'geo': geocode(el); break;
    case 'useGmaps': useGmaps(el); break;
    case 'delLoc': {
      if (!d.armed) { el.dataset.armed = 1; el.textContent = d.confirm; return; }
      busy(el, true); const r = await sb.from('locations').delete().eq('id', d.id);
      if (r.error) { busy(el, false); return toast('No se pudo eliminar.'); }
      S.locations = S.locations.filter(l => l.id !== d.id); S.schedules = S.schedules.filter(r => r.location_id !== d.id); S.week = null; render(); toast('Ubicación y sus horarios eliminados'); break;
    }
    case 'clientForm': clientForm(d.id); break;
    case 'saveClient': saveClient(d.id, el); break;
    case 'openClient': openClient(d.id); break;
    case 'pTab': S.pTab = d.t; render(); break;
    case 'saveRecord': saveRecord(el); break;
    case 'addNote': addNote(el); break;
    case 'delNote': {
      if (!d.armed) { el.dataset.armed = 1; el.textContent = d.confirm; return; }
      busy(el, true); const r = await sb.from('clinical_notes').delete().eq('id', d.id);
      if (r.error) { busy(el, false); return toast('No se pudo borrar.'); }
      S.cnotes = S.cnotes.filter(n => n.id !== d.id); render(); toast('Nota borrada'); break;
    }
    case 'sendTo': sendToModal(d.id); break;
    case 'createLinkFor': createLinkFor(d.id, el); break;
    case 'publicLink': publicLinkModal(d.id); break;
    case 'togglePublic': togglePublic(d.id, d.on === '1', el); break;

    case 'qDel': S.builder.questions.splice(+d.i, 1); redrawBuilder(); break;

    case 'createLinks': createLinks(d.id, el); break;
    case 'results': resultsModal(d.id); break;
