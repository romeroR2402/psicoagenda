<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mi cita · MiConsulta</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#006bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MiConsulta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
.page{padding-block:28px 56px;max-width:720px;margin:0 auto}
.status{display:flex;gap:14px;align-items:center}
.status h1{font-size:clamp(24px,4vw,30px)}
.upload{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;border:1.5px dashed var(--accent);border-radius:16px;background:var(--accent-soft);color:var(--accent);font-weight:700;text-align:center;cursor:pointer;overflow-wrap:anywhere}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.upload img{max-height:240px;border-radius:10px;box-shadow:var(--shadow)}
.banner{border-radius:16px;padding:14px 16px;font-weight:600;font-size:13.5px}
.policy{display:flex;gap:10px;align-items:flex-start;background:var(--pebble);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--muted)}
.policy svg{flex:none;color:var(--accent);margin-top:2px}
.stars{display:flex;gap:6px}
.stars button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mist);display:grid;place-items:center}
.stars button.on{color:#f5a623;border-color:color-mix(in srgb,#f5a623 50%,var(--line));background:#fff7e6}
.yn{display:flex;gap:8px;flex-wrap:wrap}
.yn button{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600}
.yn button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.cal-add{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body class="wash">
<header class="topbar"><div class="wrap gutter">
  <a class="brand" href="index.html"><i><svg viewBox="6 8 20 20" width="22" height="22" aria-hidden="true"><path d="M16 26c-6-3.8-9.6-7.8-9.6-12.3A5.2 5.2 0 0 1 16 10.6a5.2 5.2 0 0 1 9.6 3.1C25.6 18.2 22 22.2 16 26z" fill="currentColor"/><path d="M16 22.2v-5" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round"/><path d="M16 18.4c0-2.5 1.7-4 4.1-4 0 2.5-1.7 4-4.1 4zM16 19.6c0-2.1-1.5-3.4-3.5-3.4 0 2.1 1.5 3.4 3.5 3.4z" fill="var(--accent)"/></svg></i>MiConsulta</a>
</div></header>
<main class="page gutter"><div class="stack" id="root"><div class="empty">Cargando tu cita…</div></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="assets/common.js"></script>
<script>
(() => {
const { sb, esc, av, ic, money, MODE, fmtDay, fmtTime, pill, compress, copy, toast } = PA;
const root = document.getElementById('root');
const qp = new URLSearchParams(location.search), token = qp.get('t') || '';
let A = null, file = null, R = { stars: 0, showed: true }, RS = { slots: [], day: null, slot: null };
const STAR = (n = 22) => `<svg viewBox="0 0 24 24" width="${n}" height="${n}" fill="currentColor" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>`;
const hoursTxt = h => h >= 24 && h % 24 === 0 ? `${h / 24} día${h / 24 > 1 ? 's' : ''}` : `${h} hora${h === 1 ? '' : 's'}`;
// Fechas en formato de calendario (UTC): 20261120T180000Z
const calStamp = iso => new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');

async function load() {
  if (!sb || !/^[a-f0-9]{20,}$/.test(token)) { root.innerHTML = '<div class="card"><h2>Link no válido</h2><p class="muted">Revisa que copiaste el link completo de tu cita.</p></div>'; return; }
  const { data, error } = await sb.rpc('get_appointment', { p_token: token });
  if (error || !data) { root.innerHTML = '<div class="card"><h2>No encontramos tu cita</h2><p class="muted">Revisa que copiaste el link completo o pide ayuda a tu especialista.</p></div>'; return; }
  A = data; render();
}

function waText(url) {
  const when = `${fmtDay(A.starts_at, A.timezone)} a las ${fmtTime(A.starts_at, A.timezone)}`;
  return { unpaid: `Hola, soy ${A.patient_name}. Aparté una cita contigo para el ${when}. Esta es mi cita: ${url}`,
    review: `Hola, soy ${A.patient_name}. Ya subí mi comprobante de pago de la cita del ${when}: ${url}`,
    confirmed: `Hola, soy ${A.patient_name}, tengo cita contigo el ${when}.` }[A.status] || '';
}

function render() {
  const tz = A.timezone, url = location.href.replace(/&nueva=1/, '');
  const head = {
    unpaid: ['Tu horario está apartado', 'Para confirmarlo, haz tu pago y sube tu comprobante.'],
    review: ['Pago en revisión', `${esc(A.psych_name)} está revisando tu comprobante. Te avisará cuando confirme tu cita.`],
    confirmed: ['¡Tu cita está confirmada!', 'Te esperamos. Si no puedes asistir, cancélala aquí para liberar el horario.'],
    rejected: ['Tu cita no fue aprobada', 'El horario quedó libre. Puedes elegir otro horario o escribirle a tu especialista.'],
    cancelled: ['Cita cancelada', 'Esta cita se canceló y el horario quedó libre.'],
  }[A.status];
  const canPay = A.status === 'unpaid' || A.status === 'review';
  const active = ['unpaid', 'review', 'confirmed'].includes(A.status) && new Date(A.starts_at) > new Date();
  const canCancel = active;
  const limit = new Date(new Date(A.starts_at).getTime() - (A.cancel_hours || 0) * 3600e3), canMove = active && new Date() < limit;
  const past = A.status === 'confirmed' && new Date(A.starts_at) <= new Date();
  const place = A.location ? (A.location.kind === 'en_linea' ? 'En línea' : [A.location.name, A.location.address, A.location.city].filter(Boolean).join(', ')) : MODE[A.mode];
  const gcal = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('Cita con ' + A.psych_name)}&dates=${calStamp(A.starts_at)}/${calStamp(A.ends_at)}&details=${encodeURIComponent('Tu link de cita: ' + url)}&location=${encodeURIComponent(place)}`;
  root.innerHTML = `
    ${qp.get('nueva') ? `<div class="banner p-ok">Solicitud enviada. Guarda este link: con él puedes ver tu cita, pagar o cancelar.</div>` : ''}
    <section class="card"><div class="status">${A.photo_url ? av(A.psych_name, 'lg', A.photo_url) : `<span class="ic-box">${ic(A.status === 'confirmed' ? 'check' : 'cal', 22)}</span>`}<div><h1>${head[0]}</h1><p class="muted" style="margin:4px 0 0">${head[1]}</p></div></div>
      <dl class="kv" style="margin-top:18px">
        <dt>Estado</dt><dd>${pill(A.status)}</dd>
        <dt>Paciente</dt><dd>${esc(A.patient_name)}</dd>
        <dt>Día</dt><dd>${fmtDay(A.starts_at, tz)}</dd>
        <dt>Hora</dt><dd>${fmtTime(A.starts_at, tz)} – ${fmtTime(A.ends_at, tz)}</dd>
        <dt>Modalidad</dt><dd>${MODE[A.mode]}</dd>
        ${A.location ? `<dt>Lugar</dt><dd>${esc(A.location.name)}${A.location.address ? '<br><span class="muted small">' + esc([A.location.address, A.location.city].filter(Boolean).join(', ')) + '</span>' : ''}${A.location.kind !== 'en_linea' ? `<br><a class="btn sec sm" style="margin-top:8px" href="${esc(PA.gdir(A.location))}" target="_blank" rel="noopener">Cómo llegar en Google Maps</a>` : ''}</dd>` : ''}
        <dt>Especialista</dt><dd><a href="perfil.html?p=${encodeURIComponent(A.psych_slug)}">${esc(A.psych_name)}</a></dd>
        <dt>Costo</dt><dd>${money(A.price)}</dd>
      </dl></section>
    ${past ? reviewCard() : ''}
    ${active ? `<section class="card"><h3>Organiza tu cita</h3>
      <div class="cal-add" style="margin-top:10px"><a class="btn neu sm" href="${esc(gcal)}" target="_blank" rel="noopener">${ic('cal', 15)} Agregar a Google Calendar</a><button class="btn neu sm" id="ics">${ic('cal', 15)} Agregar a otro calendario (.ics)</button>
        ${canMove ? `<button class="btn calm sm" id="move">${ic('clock', 15)} Cambiar de horario</button>` : ''}</div>
      <div class="policy" style="margin-top:14px">${ic('shield', 18)}<span><b style="color:var(--ink)">Política de cancelación.</b> ${A.cancel_policy ? esc(A.cancel_policy) + ' ' : ''}Puedes cambiar de horario hasta ${hoursTxt(A.cancel_hours || 0)} antes de tu cita${canMove ? ` (antes del ${fmtDay(limit.toISOString(), tz).replace(/^./, c => c.toLowerCase())} a las ${fmtTime(limit.toISOString(), tz)})` : ''}. ${canMove ? '' : 'Ese plazo ya pasó: si necesitas un cambio, escríbele a tu especialista.'} Al cambiar de horario tu pago se conserva.</span></div>
    </section>` : ''}
    ${canPay ? `<section class="card"><h2>${A.status === 'review' ? 'Cambiar comprobante' : 'Paga y sube tu comprobante'}</h2>
      ${A.payment_info ? `<p class="muted small" style="margin:6px 0 4px">Datos para tu pago:</p><div class="card pre" style="box-shadow:none;border:1px solid var(--line);background:var(--bg);font-weight:600">${esc(A.payment_info)}</div>` : '<p class="muted">Tu especialista te compartirá los datos de pago.</p>'}
      <form class="form" id="f-pay" style="margin-top:14px" novalidate>
        <label class="upload" for="pay-file"><input type="file" id="pay-file" accept="image/*">${ic('upload', 26)}<span id="pay-t">Subir foto o captura del comprobante</span><img id="pay-prev" alt="Vista previa del comprobante" hidden></label>
        <label class="field"><span>Referencia o folio (opcional)</span><input id="pay-ref" maxlength="80" placeholder="Ej. SPEI 520318" value="${esc(A.payment_ref || '')}"></label>
        <p class="err" id="pay-err"></p>
        <button class="btn pri big" id="pay-go">Enviar comprobante</button>
      </form></section>` : ''}
    <section class="card"><h3>Tu link de cita</h3><p class="muted small" style="margin:4px 0 10px">Guárdalo. Es personal: con él puedes volver a esta página.</p>
      <div class="mono" id="u">${esc(url)}</div>
      <div class="chips" style="margin-top:12px"><button class="btn neu sm" id="cp">Copiar link</button>
      ${A.psych_whatsapp && ['unpaid', 'review', 'confirmed'].includes(A.status) ? `<a class="btn sec sm" target="_blank" rel="noopener" href="${esc(PA.waLink(A.psych_whatsapp, waText(url)))}">Avisar a ${esc(A.psych_name.split(' ')[0])} por WhatsApp</a>` : ''}
      ${canCancel ? `<button class="btn danger sm" id="cancel">Cancelar cita</button>` : ''}</div></section>`;
  const cp = document.getElementById('cp'); cp.onclick = () => copy(url, document.getElementById('u'));
  const ics = document.getElementById('ics');
  if (ics) ics.onclick = () => {
    const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MiConsulta//ES', 'BEGIN:VEVENT', `UID:${token}@miconsulta`, `DTSTAMP:${calStamp(new Date().toISOString())}`,
      `DTSTART:${calStamp(A.starts_at)}`, `DTEND:${calStamp(A.ends_at)}`, `SUMMARY:Cita con ${A.psych_name}`, `LOCATION:${place.replace(/[,;]/g, '\\$&')}`,
      `DESCRIPTION:Tu link de cita: ${url}`, 'BEGIN:VALARM', 'TRIGGER:-PT2H', 'ACTION:DISPLAY', 'DESCRIPTION:Tu cita es en 2 horas', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type: 'text/calendar' })); a.download = 'mi-cita.ics'; a.click();
  };
  const move = document.getElementById('move'); if (move) move.onclick = moveModal;
  if (location.hash === '#opinar') document.getElementById('opinar')?.scrollIntoView({ block: 'start' });
  const cancel = document.getElementById('cancel');
  if (cancel) cancel.onclick = async () => {
    if (!cancel.dataset.armed) { cancel.dataset.armed = 1; cancel.textContent = 'Toca otra vez para cancelar'; return; }
    cancel.disabled = true;
    const { data } = await sb.rpc('cancel_appointment', { p_token: token });
    if (data && data.ok) { toast('Cita cancelada'); load(); } else { cancel.disabled = false; toast('No se pudo cancelar. Intenta de nuevo.'); }
  };
}

/* ---------- opinión verificada ---------- */
function reviewCard() {
  if (A.review) return `<section class="card" id="opinar"><h3>Tu opinión</h3><div class="stars" style="margin:10px 0;color:#f5a623">${[1, 2, 3, 4, 5].map(i => `<span style="color:${i <= A.review.rating ? '#f5a623' : 'var(--line)'}">${STAR(20)}</span>`).join('')}</div>
    ${A.review.comment ? `<p class="pre" style="margin:0">${esc(A.review.comment)}</p>` : ''}
    ${A.review.reply ? `<div class="policy" style="margin-top:12px"><span><b style="color:var(--ink)">Respuesta de ${esc(A.psych_name.split(' ')[0])}:</b> ${esc(A.review.reply)}</span></div>` : ''}
    <p class="muted small" style="margin:10px 0 0">Gracias. Tu opinión está publicada en su perfil y nadie la puede borrar.</p></section>`;
  return `<section class="card" id="opinar"><h2>¿Cómo te fue con ${esc(A.psych_name.split(' ')[0])}?</h2>
    <p class="muted small" style="margin:4px 0 14px">Solo quienes tuvieron cita pueden opinar. Publicamos todas las calificaciones, también las bajas, y el especialista no puede borrarlas.</p>
    <div class="form">
      <div class="field"><span>Tu calificación</span><div class="stars" id="rv-stars">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-star="${i}" aria-label="${i} de 5" class="${i <= R.stars ? 'on' : ''}">${STAR()}</button>`).join('')}</div></div>
      <div class="field"><span>¿El especialista se presentó a la cita?</span><div class="yn"><button type="button" data-showed="1" aria-pressed="${R.showed}">Sí</button><button type="button" data-showed="0" aria-pressed="${!R.showed}">No se presentó</button></div></div>
      <label class="field"><span>Cuéntanos tu experiencia (opcional)</span><textarea id="rv-c" maxlength="1000" placeholder="¿Te sentiste escuchado? ¿Fue puntual? ¿Lo recomendarías?"></textarea></label>
      <p class="err" id="rv-err"></p><button class="btn pri big" id="rv-go">Publicar mi opinión</button>
      <p class="muted small" style="margin:0">Se publica con tu primer nombre y la inicial de tu apellido.</p></div></section>`;
}
document.addEventListener('click', async e => {
  const st = e.target.closest('[data-star]');
  if (st) { R.stars = +st.dataset.star; document.querySelectorAll('#rv-stars button').forEach(b => b.classList.toggle('on', +b.dataset.star <= R.stars)); return; }
  const sh = e.target.closest('[data-showed]');
  if (sh) { R.showed = sh.dataset.showed === '1'; document.querySelectorAll('[data-showed]').forEach(b => b.setAttribute('aria-pressed', b === sh)); return; }
  if (e.target.closest('#rv-go')) {
    const btn = document.getElementById('rv-go'), err = document.getElementById('rv-err');
    if (!R.stars) { err.textContent = 'Elige de 1 a 5 estrellas.'; return; }
    btn.disabled = true; btn.textContent = 'Publicando…';
    const { data, error } = await sb.rpc('submit_review', { p_token: token, p_rating: R.stars, p_comment: document.getElementById('rv-c').value, p_showed: R.showed });
    if (error || !data.ok) { btn.disabled = false; btn.textContent = 'Publicar mi opinión'; err.textContent = data && data.error === 'exists' ? 'Ya opinaste sobre esta cita.' : 'No se pudo publicar. Intenta de nuevo.'; return; }
    toast('¡Gracias por tu opinión!'); load(); return;
  }
  const d = e.target.closest('[data-rs-day]');
  if (d) { RS.day = d.dataset.rsDay; RS.slot = null; moveBody(); return; }
  const sl = e.target.closest('[data-rs-slot]');
  if (sl) { RS.slot = sl.dataset.rsSlot; moveBody(); return; }
  if (e.target.closest('#rs-go')) {
    const btn = document.getElementById('rs-go'); btn.disabled = true; btn.textContent = 'Cambiando…';
    const { data, error } = await sb.rpc('reschedule_appointment', { p_token: token, p_starts_at: RS.slot, p_mode: A.mode, p_location: A.location_id });
    if (error || !data.ok) {
      btn.disabled = false; btn.textContent = 'Confirmar nuevo horario';
      document.getElementById('rs-err').textContent = data && data.error === 'slot_taken' ? 'Alguien acaba de apartar ese horario. Elige otro.' : data && data.error === 'too_late' ? 'Ya pasó el plazo para cambiar de horario.' : 'No se pudo cambiar. Intenta de nuevo.';
      return;
    }
    PA.closeModal(); toast('¡Listo! Tu cita cambió de horario'); load();
  }
});

/* ---------- cambiar de horario ---------- */
async function moveModal() {
  PA.openModal('<h3>Cambiar de horario</h3><p class="sub">Cargando horarios libres…</p>');
  const from = new Date().toLocaleDateString('en-CA', { timeZone: A.timezone });
  const { data, error } = await sb.rpc('available_slots', { p_psych: A.psych_id, p_from: from, p_days: 28 });
  RS.slots = error ? [] : data.filter(r => r.location_id === A.location_id || r.location_id === null).map(r => r.starts_at).filter(s => s !== A.starts_at);
  RS.day = RS.slots.length ? PA.dayKey(RS.slots[0], A.timezone) : null; RS.slot = null;
  moveBody();
}
function moveBody() {
  const tz = A.timezone, byDay = {};
  RS.slots.forEach(s => { const k = PA.dayKey(s, tz); (byDay[k] = byDay[k] || []).push(s); });
  const days = Object.keys(byDay);
  PA.openModal(`<h3>Cambiar de horario</h3><p class="sub">${A.location ? esc(A.location.name) + ' · ' : ''}Tu pago se conserva. Horario actual: ${fmtDay(A.starts_at, tz)} a las ${fmtTime(A.starts_at, tz)}.</p>
    ${days.length ? `<div class="days" style="margin-bottom:12px">${days.map(k => { const d = new Date(k + 'T12:00:00Z');
        return `<button class="day ${k === RS.day ? 'on' : ''}" data-rs-day="${k}"><small>${d.toLocaleDateString('es-MX', { weekday: 'short', timeZone: 'UTC' }).replace('.', '')}</small><b>${d.getUTCDate()}</b><i>${d.toLocaleDateString('es-MX', { month: 'short', timeZone: 'UTC' }).replace('.', '')}</i></button>`; }).join('')}</div>
      <div class="slots">${(byDay[RS.day] || []).map(s => `<button class="slot ${s === RS.slot ? 'on' : ''}" data-rs-slot="${s}">${fmtTime(s, tz)}</button>`).join('')}</div>
      <p class="err" id="rs-err" style="margin-top:12px"></p>
      <button class="btn pri big" id="rs-go" style="margin-top:12px" ${RS.slot ? '' : 'disabled'}>${RS.slot ? `Cambiar al ${fmtDay(RS.slot, tz)} a las ${fmtTime(RS.slot, tz)}` : 'Elige un nuevo horario'}</button>`
    : '<div class="empty">No hay otros horarios libres en las próximas 4 semanas. Escríbele a tu especialista.</div>'}`);
}

document.addEventListener('change', async e => {
  if (e.target.id !== 'pay-file' || !e.target.files[0]) return;
  const f = e.target.files[0], err = document.getElementById('pay-err');
  if (!f.type.startsWith('image/')) { err.textContent = 'El archivo debe ser una imagen (foto o captura de pantalla).'; return; }
  try {
    file = await compress(f);
    const pv = document.getElementById('pay-prev'); pv.src = URL.createObjectURL(file); pv.hidden = false;
    document.getElementById('pay-t').textContent = f.name + ' · toca para cambiar'; err.textContent = '';
  } catch (x) { err.textContent = 'No se pudo leer la imagen. Prueba con otra.'; }
});

document.addEventListener('submit', async e => {
  if (e.target.id !== 'f-pay') return;
  e.preventDefault();
  const err = document.getElementById('pay-err'), btn = document.getElementById('pay-go');
  if (!file) { err.textContent = 'Sube la imagen de tu comprobante.'; return; }
  btn.disabled = true; btn.textContent = 'Subiendo…';
  const path = `${token}/${Date.now()}.jpg`;
  const up = await sb.storage.from('receipts').upload(path, file, { contentType: 'image/jpeg', upsert: false });
  if (up.error) { btn.disabled = false; btn.textContent = 'Enviar comprobante'; err.textContent = 'No se pudo subir la imagen. Intenta de nuevo.'; return; }
  const { data, error } = await sb.rpc('report_payment', { p_token: token, p_path: path, p_ref: document.getElementById('pay-ref').value });
  if (error || !data.ok) { btn.disabled = false; btn.textContent = 'Enviar comprobante'; err.textContent = 'No se pudo registrar tu pago. Intenta de nuevo.'; return; }
  file = null; toast('Comprobante enviado'); load();
});

load();
})();
</script>
</body>
</html>
