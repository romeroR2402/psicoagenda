<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agendar cita · MiConsulta</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#006bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MiConsulta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/app.css">
<style>
.page{padding-block:28px 56px}
.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.sticky{position:sticky;top:84px}
.head{display:flex;gap:18px;align-items:center}
.head h1{font-size:clamp(24px,3.4vw,32px)}
.price{font-family:var(--f-display);font-size:22px;font-weight:700}
.loc{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.loc:first-child{border-top:0}
.step{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;margin:18px 0 10px}
.step b{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px}
.places{display:flex;flex-direction:column;gap:8px}
.place{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left;color:var(--muted)}
.place b{display:block;color:var(--ink);font-size:14px}
.place small{display:block;font-size:12px}
.place[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ev-row{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);padding:8px;border-radius:14px;border:1px solid var(--line)}
.ev-row img{width:72px;height:48px;object-fit:cover;border-radius:10px;flex:none}
.ev-row div{flex:1;min-width:0}
.ev-row b{display:block}
.ev-row small{color:var(--muted)}
.locmap{height:240px;border-radius:16px;margin-top:12px;overflow:hidden;z-index:0}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;margin-bottom:14px}
.layout>*{min-width:0}
.head{flex-wrap:wrap}
.head>div{min-width:0}
/* opiniones */
.rv-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;margin:14px 0 6px}
.rv-avg{text-align:center}
.rv-avg b{display:block;font-size:44px;font-weight:800;line-height:1}
.rv-avg small{color:var(--muted);font-weight:600}
.stars-i{display:inline-flex;gap:2px;color:#f5a623;vertical-align:-3px}
.stars-i .off{color:var(--line)}
.dist{display:flex;flex-direction:column;gap:6px}
.dist div{display:grid;grid-template-columns:28px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.dist i{display:block;height:8px;border-radius:4px;background:var(--pebble);overflow:hidden}
.dist i span{display:block;height:100%;background:#f5a623;border-radius:4px}
.rv{border-top:1px solid var(--line);padding:16px 0}
.rv-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.rv-h b{font-size:14.5px}
.rv-h small{color:var(--muted)}
.vbadge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ok);background:var(--ok-soft);padding:3px 9px;border-radius:999px}
.vbadge.warn{color:var(--bad);background:var(--bad-soft)}
.rv-reply{margin-top:10px;background:var(--pebble);border-radius:10px;padding:10px 12px;font-size:13.5px}
.demo-note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;margin-bottom:12px}
.svc-list{display:flex;flex-direction:column;margin-top:6px}
.svc-it{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.svc-it:first-child{border-top:0}
.svc-it>div{min-width:0}
.svc-it b{display:block;font-size:14.5px}
.svc-it small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.svc-p{text-align:right;flex:none}
.rating-l{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ink);text-decoration:none}
.policy{display:flex;gap:10px;align-items:flex-start;background:var(--pebble);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);margin-top:12px}
.policy svg{flex:none;color:var(--accent);margin-top:1px}
@media (max-width:520px){.rv-top{grid-template-columns:1fr}}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
</style>
</head>
<body class="wash">
<header class="topbar"><div class="wrap gutter">
  <a class="brand" href="index.html"><i><svg viewBox="6 8 20 20" width="22" height="22" aria-hidden="true"><path d="M16 26c-6-3.8-9.6-7.8-9.6-12.3A5.2 5.2 0 0 1 16 10.6a5.2 5.2 0 0 1 9.6 3.1C25.6 18.2 22 22.2 16 26z" fill="currentColor"/><path d="M16 22.2v-5" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round"/><path d="M16 18.4c0-2.5 1.7-4 4.1-4 0 2.5-1.7 4-4.1 4zM16 19.6c0-2.1-1.5-3.4-3.5-3.4 0 2.1 1.5 3.4 3.5 3.4z" fill="var(--accent)"/></svg></i>MiConsulta</a>
  <nav class="top-links"><a class="btn neu sm" href="index.html">Buscar especialistas</a></nav>
</div></header>
<main class="page"><div class="wrap gutter" id="root"><div class="empty">Cargando perfil…</div></div></main>

<footer class="mini-foot"><a href="aviso-privacidad.html">Aviso de privacidad</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="assets/common.js"></script>
<script>
(() => {
const { sb, esc, av, ic, money, MODE, fmtDay, fmtTime, dayKey } = PA;
const root = document.getElementById('root');
const QP = new URLSearchParams(location.search), SITE = QP.get('sitio') || '', slug = QP.get('p') || SITE;
if (!SITE) { try { sessionStorage.removeItem('mc_sitio'); } catch (e) {} } else PA.siteSlug();
const SQ = PA.siteQS(SITE);
let P = null, slots = [], byDay = {}, B = { loc: null, day: null, slot: null }, RV = null, rvAll = false;
const STAR = n => `<svg viewBox="0 0 24 24" width="${n}" height="${n}" fill="currentColor" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>`;
const starsI = (r, n = 16) => `<span class="stars-i" aria-label="${r} de 5">${[1, 2, 3, 4, 5].map(i => `<span class="${i <= Math.round(r) ? '' : 'off'}">${STAR(n)}</span>`).join('')}</span>`;
const hoursTxt = h => h >= 24 && h % 24 === 0 ? `${h / 24} día${h / 24 > 1 ? 's' : ''}` : `${h} hora${h === 1 ? '' : 's'}`;
const DOW3 = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const locOf = id => (P.locations || []).find(l => l.id === id);

function fail(msg) { root.innerHTML = `${SITE ? '' : '<a class="back" href="index.html">← Volver al buscador</a>'}<div class="card"><h2>No encontramos este perfil</h2><p class="muted">${msg}</p></div>`; }

async function load() {
  if (!sb) return fail('No se pudo cargar la conexión.');
  const { data, error } = await sb.from('profiles').select('id,is_demo,full_name,slug,specialty,specialties,services,credentials,title,license,license_verified,cancel_policy,cancel_hours,bio,topics,price,session_minutes,timezone,photo_url,whatsapp,languages,locations(id,kind,name,address,city,lat,lng,maps_url),schedules(weekday,start_time,end_time,location_id)')
    .eq('slug', slug).eq('is_listed', true).eq('is_active', true).maybeSingle();
  if (error || !data) return fail('Puede que el link esté mal escrito o que el especialista ya no esté disponible.');
  P = data; document.title = SITE ? `${P.full_name} · Agenda tu cita` : `${P.full_name} · MiConsulta`;
  if (SITE) PA.siteBrand({ name: P.full_name, title: P.title, photo: P.photo_url, slug: P.slug });
  render();
  sb.rpc('public_events', { p_psych: P.id }).then(({ data }) => { if (data && data.length) renderEvents(data); });
  sb.rpc('public_reviews', { p_psych: P.id }).then(({ data }) => { RV = data; renderReviews(); });
  await loadSlots();
}

async function loadSlots() {
  const from = new Date().toLocaleDateString('en-CA', { timeZone: P.timezone });
  const { data, error } = await sb.rpc('available_slots', { p_psych: P.id, p_from: from, p_days: 28 });
  slots = error ? [] : data.map(r => ({ s: r.starts_at, loc: r.location_id }));
  const want = new URLSearchParams(location.search).get('slot'), hit = slots.find(x => x.s === want);
  if (hit && !B.slot) {
    B.loc = hit.loc || placeOptions()[0]?.id || null; B.slot = hit.s; B.day = dayKey(hit.s, P.timezone);
    history.replaceState(null, '', location.pathname + (SITE ? '?sitio=' : '?p=') + encodeURIComponent(slug) + '#agendar');
  }
  if (!B.loc || !placeOptions().some(l => l.id === B.loc)) B.loc = placeOptions()[0]?.id || null;
  regroup();
  renderBooking(error ? 'No pudimos cargar los horarios. Recarga la página.' : '');
  if (location.hash === '#agendar') document.getElementById('agendar').scrollIntoView({ block: 'start' });
}

// Ubicaciones con horarios libres; los horarios sin ubicación asignada valen para todas.
function placeOptions() {
  const first = l => (slots.find(x => x.loc === l.id || x.loc === null) || {}).s || '9';
  return (P.locations || []).filter(l => slots.some(x => x.loc === l.id || x.loc === null)).sort((a, b) => first(a).localeCompare(first(b)));
}
function regroup() {
  byDay = {};
  slots.filter(x => x.loc === B.loc || x.loc === null).forEach(x => { const k = dayKey(x.s, P.timezone); (byDay[k] = byDay[k] || []).push(x.s); });
  if (!B.day || !byDay[B.day]) B.day = Object.keys(byDay)[0] || null;
  if (B.slot && !(byDay[dayKey(B.slot, P.timezone)] || []).includes(B.slot)) B.slot = null;
}
function hoursOf(l) {
  const rs = (P.schedules || []).filter(r => r.location_id === l.id || r.location_id === null).sort((a, b) => ((a.weekday + 6) % 7) - ((b.weekday + 6) % 7) || a.start_time.localeCompare(b.start_time));
  return rs.map(r => `${DOW3[r.weekday]} ${r.start_time.slice(0, 5)}–${r.end_time.slice(0, 5)}`).join(' · ');
}

function renderReviews() {
  const el = document.getElementById('reviews'), top = document.getElementById('rating-top'); if (!el || !RV) return;
  if (top) top.innerHTML = RV.count ? `<a class="rating-l" href="#reviews">${starsI(RV.avg, 15)} ${RV.avg} · ${RV.count} ${RV.count === 1 ? 'opinión' : 'opiniones'}</a>` : '<span class="muted small">Aún sin opiniones</span>';
  const first = P.full_name.split(' ')[0];
  if (!RV.count) { el.innerHTML = `<h3>Opiniones</h3><p class="muted" style="margin:8px 0 0">${esc(first)} aún no tiene opiniones. Solo pueden opinar pacientes que tuvieron una cita confirmada.</p>`; return; }
  const items = rvAll ? RV.items : RV.items.slice(0, 5);
  el.innerHTML = `<h3>Opiniones de pacientes</h3>
    <div class="rv-top"><div class="rv-avg"><b>${RV.avg}</b>${starsI(RV.avg, 18)}<small style="display:block;margin-top:4px">${RV.count} ${RV.count === 1 ? 'opinión' : 'opiniones'}</small></div>
      <div class="dist">${[5, 4, 3, 2, 1].map(n => `<div><span>${n} ★</span><i><span style="width:${Math.round(100 * RV.dist[n] / RV.count)}%"></span></i><span>${RV.dist[n]}</span></div>`).join('')}</div></div>
    <p class="muted small" style="margin:8px 0 0">${ic('shield', 13)} Todas son de pacientes con cita confirmada. Publicamos todas las calificaciones y ${esc(first)} no puede borrarlas.${RV.no_show ? ` En ${RV.no_show} cita${RV.no_show === 1 ? '' : 's'} el paciente reportó que el especialista no se presentó.` : ''}</p>
    ${items.map(r => `<div class="rv"><div class="rv-h"><div>${starsI(r.rating, 15)} <b style="margin-left:6px">${esc(r.author)}</b></div><small>${new Date(r.created_at).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' })}</small></div>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="vbadge">${ic('check', 12)} Cita verificada · ${r.mode === 'en_linea' ? 'en línea' : 'presencial'}</span>${r.showed_up ? '' : '<span class="vbadge warn">El especialista no se presentó</span>'}</div>
      ${r.comment ? `<p class="pre" style="margin:10px 0 0">${esc(r.comment)}</p>` : ''}
      ${r.reply ? `<div class="rv-reply"><b>Respuesta de ${esc(first)}:</b> ${esc(r.reply)}</div>` : ''}</div>`).join('')}
    ${RV.items.length > 5 ? `<button class="btn neu" data-a="rvmore" style="margin-top:6px">${rvAll ? 'Ver menos' : `Ver las ${RV.items.length} opiniones`}</button>` : ''}`;
}

function renderEvents(list) {
  const el = document.getElementById('events'); if (!el) return;
  el.hidden = false;
  const EVK = { conferencia: 'Conferencia', taller: 'Taller', grupo: 'Grupo de apoyo' };
  el.innerHTML = `<h3>Próximos talleres y conferencias</h3><div class="stack" style="margin-top:12px;gap:10px">${list.map(e => `<a class="ev-row" href="evento.html?e=${e.public_token}${SQ}">
    ${e.image_url ? `<img src="${esc(e.image_url)}" alt="">` : `<span class="ic-box">${ic('mic')}</span>`}<div><span class="tag" style="font-size:11px">${EVK[e.kind] || 'Conferencia'}${e.price ? ' · ' + money(e.price) : ' · Gratis'}</span><b>${esc(e.title)}</b><small>${fmtDay(e.starts_at, P.timezone)} · ${fmtTime(e.starts_at, P.timezone)} · ${e.mode === 'en_linea' ? 'En línea' : esc(e.place || 'Presencial')}</small></div><span class="btn sec sm">Asistir</span></a>`).join('')}</div>`;
}

function render() {
  const locs = P.locations || [];
  root.innerHTML = `${SITE ? '' : '<a class="back" href="index.html">← Volver al buscador</a>'}
  <div class="layout">
    <div class="stack">
      <section class="card"><div class="head">${av(P.full_name, 'xl', P.photo_url)}<div>
        <h1>${esc(P.full_name)}</h1><div class="muted">${esc(P.title || 'Especialista')}${P.license ? ' · Cédula profesional ' + esc(P.license) : ''}</div>
        ${P.license_verified ? `<span class="vbadge" style="margin-top:8px">${ic('shield', 13)} Cédula verificada${SITE ? '' : ' por MiConsulta'}</span>` : ''}
        <div id="rating-top" style="margin-top:8px"></div>
        <div class="meta" style="margin-top:8px"><span class="price">${money(P.price)}</span><span>${ic('clock', 14)}Sesión de ${P.session_minutes} min</span></div></div></div>
        ${(P.topics || []).length ? `<div class="tags" style="margin-top:16px">${P.topics.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        ${(P.languages || []).length ? `<div class="muted small" style="margin-top:10px">Idiomas: ${P.languages.map(esc).join(', ')}</div>` : ''}
      </section>
      ${P.bio ? `<section class="card"><h3>Sobre mí</h3><p class="pre" style="margin:8px 0 0">${esc(P.bio)}</p></section>` : ''}
      ${(P.services || []).length ? `<section class="card"><h3>Servicios</h3><div class="svc-list">${P.services.map(v => `<div class="svc-it"><div><b>${esc(v.name)}</b>${v.desc ? `<small>${esc(v.desc)}</small>` : ''}</div>
        <div class="svc-p">${v.price != null ? `<b>${money(v.price)}</b>` : '<span class="muted small">Consultar</span>'}${v.minutes ? `<small>${v.minutes} min</small>` : ''}</div></div>`).join('')}</div></section>` : ''}
      ${(P.credentials || []).length ? `<section class="card"><h3>Diplomados y certificaciones</h3><div class="svc-list">${P.credentials.map(c => `<div class="svc-it"><div>${c.type ? `<span class="tag" style="font-size:11px;margin-bottom:4px;display:inline-block">${esc({ diplomado: 'Diplomado', certificacion: 'Certificación', especialidad: 'Especialidad', maestria: 'Maestría', doctorado: 'Doctorado', licenciatura: 'Licenciatura', curso: 'Curso o taller' }[c.type] || c.type)}</span>` : ''}<b>${esc(c.name)}</b><small>${esc([c.org, c.year].filter(Boolean).join(' · '))}${c.id ? ` · Folio ${esc(c.id)}` : ''}</small></div>
        ${c.url && /^https:\/\//.test(c.url) ? `<a class="btn neu sm" href="${esc(c.url)}" target="_blank" rel="noopener nofollow">${ic('shield', 14)} Verificar</a>` : ''}</div>`).join('')}</div></section>` : ''}
      <section class="card"><h3>Dónde atiende</h3><div style="margin-top:6px">${locs.length ? locs.map(l => `<div class="loc"><span class="ic-box">${ic(l.kind === 'en_linea' ? 'video' : 'pin')}</span><div><b>${esc(l.name)}</b><div class="muted small">${l.kind === 'en_linea' ? 'Consulta en línea por videollamada' : esc([l.address, l.city].filter(Boolean).join(', '))}</div>
          ${hoursOf(l) ? `<div class="small" style="margin-top:4px">${ic('clock', 13)} ${hoursOf(l)}</div>` : ''}
          ${l.kind === 'presencial' ? `<div class="chips" style="margin-top:8px"><a class="btn sec sm" href="${esc(PA.gdir(l))}" target="_blank" rel="noopener">${ic('pin', 14)} Cómo llegar</a><a class="btn neu sm" href="${esc(PA.gmaps(l))}" target="_blank" rel="noopener">Ver en Google Maps</a></div>` : ''}</div></div>`).join('') : '<p class="muted">Aún no hay ubicaciones registradas.</p>'}</div>
        ${locs.some(l => l.lat != null) ? '<div class="locmap" id="locmap"></div>' : ''}</section>
      <section class="card" id="reviews"><h3>Opiniones</h3><p class="muted small">Cargando…</p></section>
      <section class="card" id="events" hidden></section>
    </div>
    <div class="sticky" id="agendar"><section class="card" id="booking"></section></div>
  </div>`;
  renderBooking();
  const pins = locs.filter(l => l.lat != null);
  if (pins.length && window.L) {
    const m = L.map('locmap', { scrollWheelZoom: false });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(m);
    pins.forEach(l => L.marker([l.lat, l.lng], { icon: L.divIcon({ className: '', html: `<div class="mk"><b>${P.price != null ? '$' + P.price.toLocaleString('es-MX') : 'Consultar'}</b><span>${esc(l.name)}</span></div>`, iconSize: [0, 0] }) }).addTo(m));
    if (pins.length === 1) m.setView([pins[0].lat, pins[0].lng], 15); else m.fitBounds(pins.map(l => [l.lat, l.lng]), { padding: [40, 40] });
  }
}

function renderBooking(err = '') {
  const el = document.getElementById('booking'); if (!el) return;
  const opts = placeOptions(), cur = locOf(B.loc);
  if (!(P.locations || []).length) { el.innerHTML = `<h2>Agenda tu cita</h2><p class="muted">Este especialista todavía no configura dónde atiende. Vuelve pronto.</p>`; return; }
  const nextOf = l => { const x = slots.find(y => y.loc === l.id || y.loc === null); return x ? new Date(x.s).toLocaleDateString('es-MX', { timeZone: P.timezone, day: 'numeric', month: 'short' }).replace('.', '') : ''; };
  const days = Object.keys(byDay);
  const keep = { n: val('bk-name'), ph: val('bk-phone'), em: val('bk-email'), no: val('bk-note'), ok: document.getElementById('bk-ok')?.checked };
  const prevScroll = document.getElementById('days')?.scrollLeft || 0;
  el.innerHTML = `${P.is_demo ? '<div class="demo-note">Perfil de demostración: los datos son de ejemplo y las citas no son reales.</div>' : ''}<h2>Agenda tu cita</h2><p class="muted small" style="margin:0">El horario se aparta al solicitarlo y se confirma cuando ${esc(P.full_name.split(' ')[0])} verifica tu pago.</p>
    <div class="step"><b>1</b>¿Dónde quieres tu cita?</div>
    ${opts.length ? `<div class="places" role="group" aria-label="Ubicación">${opts.map(l => `<button class="place" data-place="${l.id}" aria-pressed="${B.loc === l.id}">${ic(l.kind === 'en_linea' ? 'video' : 'pin', 18)}<span><b>${esc(l.name)}</b><small>${l.kind === 'en_linea' ? 'En línea' : esc(l.city || l.address || 'Presencial')} · próx. ${nextOf(l)}</small></span></button>`).join('')}</div>
      ${cur && cur.kind === 'presencial' ? `<div class="muted small" style="margin-top:8px">${esc([cur.address, cur.city].filter(Boolean).join(', '))} · <a href="${esc(PA.gdir(cur))}" target="_blank" rel="noopener">Cómo llegar</a></div>` : ''}` : ''}
    <div class="step"><b>2</b>Día y hora</div>
    ${days.length ? `<div class="days-wrap"><button class="days-nav" data-scroll="-1" aria-label="Días anteriores"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button><div class="days" id="days">${days.map(k => { const d = new Date(k + 'T12:00:00');
        return `<button class="day ${k === B.day ? 'on' : ''}" data-day="${k}" aria-pressed="${k === B.day}" aria-label="${fmtDay(d)}"><small>${d.toLocaleDateString('es-MX', { weekday: 'short' }).replace('.', '')}</small><b>${d.getDate()}</b><i>${d.toLocaleDateString('es-MX', { month: 'short' }).replace('.', '')}</i></button>`; }).join('')}</div><button class="days-nav" data-scroll="1" aria-label="Más días"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></div>
      <div class="muted small" style="margin:2px 0 8px">${fmtDay(new Date(B.day + 'T12:00:00'))}</div>
      <div class="slots">${byDay[B.day].map(s => `<button class="slot ${B.slot === s ? 'on' : ''}" data-slot="${s}" aria-pressed="${B.slot === s}">${fmtTime(s, P.timezone)}</button>`).join('')}</div>`
      : `<div class="empty">${err || 'No hay horarios libres en las próximas 4 semanas.'}</div>`}
    <div class="step"><b>3</b>Tus datos</div>
    <form class="form" id="f-book" novalidate>
      <label class="field"><span>Nombre completo</span><input id="bk-name" autocomplete="name" required></label>
      <label class="field"><span>Teléfono (WhatsApp)</span><input id="bk-phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="Ej. 55 1234 5678" required></label>
      <label class="field"><span>Correo (recomendado)</span><input id="bk-email" type="email" autocomplete="email" placeholder="Para enviarte la confirmación y el recordatorio"></label>
      <label class="field"><span>Motivo de consulta (opcional)</span><textarea id="bk-note" maxlength="500" placeholder="Cuéntale brevemente qué te gustaría trabajar"></textarea></label>
      <label class="consent"><input type="checkbox" id="bk-ok"><span>He leído el <a href="aviso-privacidad.html" target="_blank" rel="noopener">Aviso de privacidad</a> y doy mi consentimiento expreso para que el especialista trate mis datos personales, incluidos los de salud.</span></label>
      <p class="err" id="bk-err">${err && days.length ? esc(err) : ''}</p>
      <div class="policy" style="margin-top:0">${ic('shield', 16)}<span><b style="color:var(--ink)">Cancelación y cambios:</b> ${P.cancel_policy ? esc(P.cancel_policy) + ' ' : ''}Puedes cambiar de horario desde tu link de cita hasta ${hoursTxt(P.cancel_hours ?? 24)} antes, y tu pago se conserva.</span></div>
      <button class="btn pri big" id="bk-go" ${B.slot ? '' : 'disabled'}>${B.slot ? `Solicitar cita · ${fmtTime(B.slot, P.timezone)}` : 'Elige un horario'}</button>
    </form>`;
  [['bk-name', keep.n], ['bk-phone', keep.ph], ['bk-email', keep.em], ['bk-note', keep.no]].forEach(([id, v]) => { if (v) document.getElementById(id).value = v; });
  if (keep.ok) document.getElementById('bk-ok').checked = true;
  const row = document.getElementById('days');
  if (row) {
    row.style.scrollBehavior = 'auto'; row.scrollLeft = prevScroll; row.style.scrollBehavior = '';
    const on = row.querySelector('.day.on');
    if (on && (on.offsetLeft < row.scrollLeft || on.offsetLeft + on.offsetWidth > row.scrollLeft + row.clientWidth)) row.scrollLeft = on.offsetLeft - 8;
    navState(row);
    row.addEventListener('scroll', () => navState(row), { passive: true });
    row.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && row.scrollWidth > row.clientWidth) { e.preventDefault(); row.scrollLeft += e.deltaY; } }, { passive: false });
  }
}
function navState(row) {
  const [prev, next] = row.parentElement.querySelectorAll('.days-nav');
  prev.disabled = row.scrollLeft <= 2; next.disabled = row.scrollLeft + row.clientWidth >= row.scrollWidth - 2;
}
const val = id => (document.getElementById(id)?.value || '').trim();

document.addEventListener('click', e => {
  const m = e.target.closest('[data-mode]'), d = e.target.closest('[data-day]'), s = e.target.closest('[data-slot]'), sc = e.target.closest('[data-scroll]');
  if (e.target.closest('[data-a="rvmore"]')) { rvAll = !rvAll; renderReviews(); return; }
  if (sc) { const row = document.getElementById('days'); row.scrollBy({ left: +sc.dataset.scroll * row.clientWidth * 0.8 }); return; }
  const pl = e.target.closest('[data-place]');
  if (pl) { B.loc = pl.dataset.place; B.slot = null; B.day = null; regroup(); renderBooking(); return; }
  if (d) { B.day = d.dataset.day; B.slot = null; renderBooking(); }
  if (s) { B.slot = s.dataset.slot; renderBooking(); document.getElementById('bk-name').focus({ preventScroll: true }); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'f-book') return;
  e.preventDefault();
  const err = document.getElementById('bk-err'), btn = document.getElementById('bk-go');
  const name = val('bk-name'), phone = val('bk-phone'), email = val('bk-email');
  if (!B.slot) return err.textContent = 'Elige un día y una hora.';
  if (name.length < 3) return err.textContent = 'Escribe tu nombre completo.';
  if (!document.getElementById('bk-ok').checked) return err.textContent = 'Para agendar, acepta el Aviso de privacidad.';
  if (phone.replace(/\D/g, '').length < 8) return err.textContent = 'Escribe tu teléfono con al menos 8 dígitos.';
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err.textContent = 'El correo no es válido.';
  btn.disabled = true; btn.textContent = 'Apartando tu horario…';
  const { data, error } = await sb.rpc('book_appointment', { p_psych: P.id, p_starts_at: B.slot, p_mode: locOf(B.loc)?.kind || 'en_linea', p_location: B.loc,
    p_name: name, p_phone: phone, p_email: email || null, p_note: val('bk-note') || null });
  if (!error && data.ok) { location.href = 'cita.html?t=' + data.token + '&nueva=1' + SQ; return; }
  const code = error ? 'network' : data.error;
  const MSG = { slot_taken: 'Alguien acaba de apartar ese horario. Elige otro.', too_many: 'Ya tienes 3 citas pendientes con este especialista.', location: 'Elige un consultorio.',
    name: 'Escribe tu nombre completo.', phone: 'Revisa tu teléfono.', email: 'Revisa tu correo.', network: 'No pudimos conectarnos. Intenta de nuevo.' };
  if (code === 'slot_taken') { B.slot = null; await loadSlots(); }
  else renderBooking();
  document.getElementById('bk-err').textContent = MSG[code] || 'No se pudo apartar la cita. Intenta de nuevo.';
});

load();
})();
</script>
</body>
</html>
