<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agendar cita · MiConsulta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/app.css">
<style>
.page{padding-block:28px 56px}
.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.sticky{position:sticky;top:84px}
.head{display:flex;gap:18px;align-items:center}
.head h1{font-size:clamp(24px,3.4vw,32px)}
.price{font-family:var(--f-display);font-size:22px;font-weight:700}
.loc{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.loc:first-child{border-top:0}
.step{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;margin:18px 0 10px}
.step b{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px}
.places{display:flex;flex-direction:column;gap:8px}
.place{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left;color:var(--muted)}
.place b{display:block;color:var(--ink);font-size:14px}
.place small{display:block;font-size:12px}
.place[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.locmap{height:240px;border-radius:16px;margin-top:12px;overflow:hidden;z-index:0}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;margin-bottom:14px}
.layout>*{min-width:0}
.head{flex-wrap:wrap}
.head>div{min-width:0}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
</style>
</head>
<body class="wash">
<header class="topbar"><div class="wrap gutter">
  <a class="brand" href="index.html"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg></i>MiConsulta</a>
  <nav class="top-links"><a class="btn neu sm" href="index.html">Buscar especialistas</a></nav>
</div></header>
<main class="page"><div class="wrap gutter" id="root"><div class="empty">Cargando perfil…</div></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="assets/common.js"></script>
<script>
(() => {
const { sb, esc, av, ic, money, MODE, fmtDay, fmtTime, dayKey } = PA;
const root = document.getElementById('root');
const slug = new URLSearchParams(location.search).get('p') || '';
let P = null, slots = [], byDay = {}, B = { loc: null, day: null, slot: null };
const DOW3 = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const locOf = id => (P.locations || []).find(l => l.id === id);

function fail(msg) { root.innerHTML = `<a class="back" href="index.html">← Volver al buscador</a><div class="card"><h2>No encontramos este perfil</h2><p class="muted">${msg}</p></div>`; }

async function load() {
  if (!sb) return fail('No se pudo cargar la conexión.');
  const { data, error } = await sb.from('profiles').select('id,full_name,slug,title,license,bio,topics,price,session_minutes,timezone,photo_url,whatsapp,languages,locations(id,kind,name,address,city,lat,lng,maps_url),schedules(weekday,start_time,end_time,location_id)')
    .eq('slug', slug).eq('is_listed', true).eq('is_active', true).maybeSingle();
  if (error || !data) return fail('Puede que el link esté mal escrito o que el especialista ya no esté disponible.');
  P = data; document.title = `${P.full_name} · MiConsulta`;
  render();
  await loadSlots();
}

async function loadSlots() {
  const from = new Date().toLocaleDateString('en-CA', { timeZone: P.timezone });
  const { data, error } = await sb.rpc('available_slots', { p_psych: P.id, p_from: from, p_days: 28 });
  slots = error ? [] : data.map(r => ({ s: r.starts_at, loc: r.location_id }));
  const want = new URLSearchParams(location.search).get('slot'), hit = slots.find(x => x.s === want);
  if (hit && !B.slot) {
    B.loc = hit.loc || placeOptions()[0]?.id || null; B.slot = hit.s; B.day = dayKey(hit.s, P.timezone);
    history.replaceState(null, '', location.pathname + '?p=' + encodeURIComponent(slug) + '#agendar');
  }
  if (!B.loc || !placeOptions().some(l => l.id === B.loc)) B.loc = placeOptions()[0]?.id || null;
  regroup();
  renderBooking(error ? 'No pudimos cargar los horarios. Recarga la página.' : '');
  if (location.hash === '#agendar') document.getElementById('agendar').scrollIntoView({ block: 'start' });
}

// Ubicaciones con horarios libres; los horarios sin ubicación asignada valen para todas.
function placeOptions() {
  const first = l => (slots.find(x => x.loc === l.id || x.loc === null) || {}).s || '9';
  return (P.locations || []).filter(l => slots.some(x => x.loc === l.id || x.loc === null)).sort((a, b) => first(a).localeCompare(first(b)));
}
function regroup() {
  byDay = {};
  slots.filter(x => x.loc === B.loc || x.loc === null).forEach(x => { const k = dayKey(x.s, P.timezone); (byDay[k] = byDay[k] || []).push(x.s); });
  if (!B.day || !byDay[B.day]) B.day = Object.keys(byDay)[0] || null;
  if (B.slot && !(byDay[dayKey(B.slot, P.timezone)] || []).includes(B.slot)) B.slot = null;
}
function hoursOf(l) {
  const rs = (P.schedules || []).filter(r => r.location_id === l.id || r.location_id === null).sort((a, b) => ((a.weekday + 6) % 7) - ((b.weekday + 6) % 7) || a.start_time.localeCompare(b.start_time));
  return rs.map(r => `${DOW3[r.weekday]} ${r.start_time.slice(0, 5)}–${r.end_time.slice(0, 5)}`).join(' · ');
}

function render() {
  const locs = P.locations || [];
  root.innerHTML = `<a class="back" href="index.html">← Volver al buscador</a>
  <div class="layout">
    <div class="stack">
      <section class="card"><div class="head">${av(P.full_name, 'xl', P.photo_url)}<div>
        <h1>${esc(P.full_name)}</h1><div class="muted">${esc(P.title || 'Psicólogo')}${P.license ? ' · Cédula profesional ' + esc(P.license) : ''}</div>
        <div class="meta" style="margin-top:8px"><span class="price">${money(P.price)}</span><span>${ic('clock', 14)}Sesión de ${P.session_minutes} min</span></div></div></div>
        ${(P.topics || []).length ? `<div class="tags" style="margin-top:16px">${P.topics.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
        ${(P.languages || []).length ? `<div class="muted small" style="margin-top:10px">Idiomas: ${P.languages.map(esc).join(', ')}</div>` : ''}
      </section>
      ${P.bio ? `<section class="card"><h3>Sobre mí</h3><p class="pre" style="margin:8px 0 0">${esc(P.bio)}</p></section>` : ''}
      <section class="card"><h3>Dónde atiende</h3><div style="margin-top:6px">${locs.length ? locs.map(l => `<div class="loc"><span class="ic-box">${ic(l.kind === 'en_linea' ? 'video' : 'pin')}</span><div><b>${esc(l.name)}</b><div class="muted small">${l.kind === 'en_linea' ? 'Consulta en línea por videollamada' : esc([l.address, l.city].filter(Boolean).join(', '))}</div>
          ${hoursOf(l) ? `<div class="small" style="margin-top:4px">${ic('clock', 13)} ${hoursOf(l)}</div>` : ''}
          ${l.kind === 'presencial' ? `<div class="chips" style="margin-top:8px"><a class="btn sec sm" href="${esc(PA.gdir(l))}" target="_blank" rel="noopener">${ic('pin', 14)} Cómo llegar</a><a class="btn neu sm" href="${esc(PA.gmaps(l))}" target="_blank" rel="noopener">Ver en Google Maps</a></div>` : ''}</div></div>`).join('') : '<p class="muted">Aún no hay ubicaciones registradas.</p>'}</div>
        ${locs.some(l => l.lat != null) ? '<div class="locmap" id="locmap"></div>' : ''}</section>
    </div>
    <div class="sticky" id="agendar"><section class="card" id="booking"></section></div>
  </div>`;
  renderBooking();
  const pins = locs.filter(l => l.lat != null);
  if (pins.length && window.L) {
    const m = L.map('locmap', { scrollWheelZoom: false });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(m);
    pins.forEach(l => L.marker([l.lat, l.lng], { icon: L.divIcon({ className: '', html: `<div class="mk"><b>${P.price != null ? '$' + P.price.toLocaleString('es-MX') : 'Consultar'}</b><span>${esc(l.name)}</span></div>`, iconSize: [0, 0] }) }).addTo(m));
    if (pins.length === 1) m.setView([pins[0].lat, pins[0].lng], 15); else m.fitBounds(pins.map(l => [l.lat, l.lng]), { padding: [40, 40] });
  }
}

function renderBooking(err = '') {
  const el = document.getElementById('booking'); if (!el) return;
  const opts = placeOptions(), cur = locOf(B.loc);
  if (!(P.locations || []).length) { el.innerHTML = `<h2>Agenda tu cita</h2><p class="muted">Este especialista todavía no configura dónde atiende. Vuelve pronto.</p>`; return; }
  const nextOf = l => { const x = slots.find(y => y.loc === l.id || y.loc === null); return x ? new Date(x.s).toLocaleDateString('es-MX', { timeZone: P.timezone, day: 'numeric', month: 'short' }).replace('.', '') : ''; };
  const days = Object.keys(byDay);
  const keep = { n: val('bk-name'), ph: val('bk-phone'), em: val('bk-email'), no: val('bk-note') };
  const prevScroll = document.getElementById('days')?.scrollLeft || 0;
  el.innerHTML = `<h2>Agenda tu cita</h2><p class="muted small" style="margin:0">El horario se aparta al solicitarlo y se confirma cuando ${esc(P.full_name.split(' ')[0])} verifica tu pago.</p>
    <div class="step"><b>1</b>¿Dónde quieres tu cita?</div>
    ${opts.length ? `<div class="places" role="group" aria-label="Ubicación">${opts.map(l => `<button class="place" data-place="${l.id}" aria-pressed="${B.loc === l.id}">${ic(l.kind === 'en_linea' ? 'video' : 'pin', 18)}<span><b>${esc(l.name)}</b><small>${l.kind === 'en_linea' ? 'En línea' : esc(l.city || l.address || 'Presencial')} · próx. ${nextOf(l)}</small></span></button>`).join('')}</div>
      ${cur && cur.kind === 'presencial' ? `<div class="muted small" style="margin-top:8px">${esc([cur.address, cur.city].filter(Boolean).join(', '))} · <a href="${esc(PA.gdir(cur))}" target="_blank" rel="noopener">Cómo llegar</a></div>` : ''}` : ''}
    <div class="step"><b>2</b>Día y hora</div>
    ${days.length ? `<div class="days-wrap"><button class="days-nav" data-scroll="-1" aria-label="Días anteriores"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button><div class="days" id="days">${days.map(k => { const d = new Date(k + 'T12:00:00');
        return `<button class="day ${k === B.day ? 'on' : ''}" data-day="${k}" aria-pressed="${k === B.day}" aria-label="${fmtDay(d)}"><small>${d.toLocaleDateString('es-MX', { weekday: 'short' }).replace('.', '')}</small><b>${d.getDate()}</b><i>${d.toLocaleDateString('es-MX', { month: 'short' }).replace('.', '')}</i></button>`; }).join('')}</div><button class="days-nav" data-scroll="1" aria-label="Más días"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></div>
      <div class="muted small" style="margin:2px 0 8px">${fmtDay(new Date(B.day + 'T12:00:00'))}</div>
      <div class="slots">${byDay[B.day].map(s => `<button class="slot ${B.slot === s ? 'on' : ''}" data-slot="${s}" aria-pressed="${B.slot === s}">${fmtTime(s, P.timezone)}</button>`).join('')}</div>`
      : `<div class="empty">${err || 'No hay horarios libres en las próximas 4 semanas.'}</div>`}
    <div class="step"><b>3</b>Tus datos</div>
    <form class="form" id="f-book" novalidate>
      <label class="field"><span>Nombre completo</span><input id="bk-name" autocomplete="name" required></label>
      <label class="field"><span>Teléfono (WhatsApp)</span><input id="bk-phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="Ej. 55 1234 5678" required></label>
      <label class="field"><span>Correo (recomendado)</span><input id="bk-email" type="email" autocomplete="email" placeholder="Para enviarte la confirmación y el recordatorio"></label>
      <label class="field"><span>Motivo de consulta (opcional)</span><textarea id="bk-note" maxlength="500" placeholder="Cuéntale brevemente qué te gustaría trabajar"></textarea></label>
      <p class="err" id="bk-err">${err && days.length ? esc(err) : ''}</p>
      <button class="btn pri big" id="bk-go" ${B.slot ? '' : 'disabled'}>${B.slot ? `Solicitar cita · ${fmtTime(B.slot, P.timezone)}` : 'Elige un horario'}</button>
    </form>`;
  [['bk-name', keep.n], ['bk-phone', keep.ph], ['bk-email', keep.em], ['bk-note', keep.no]].forEach(([id, v]) => { if (v) document.getElementById(id).value = v; });
  const row = document.getElementById('days');
  if (row) {
    row.style.scrollBehavior = 'auto'; row.scrollLeft = prevScroll; row.style.scrollBehavior = '';
    const on = row.querySelector('.day.on');
    if (on && (on.offsetLeft < row.scrollLeft || on.offsetLeft + on.offsetWidth > row.scrollLeft + row.clientWidth)) row.scrollLeft = on.offsetLeft - 8;
    navState(row);
    row.addEventListener('scroll', () => navState(row), { passive: true });
    row.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && row.scrollWidth > row.clientWidth) { e.preventDefault(); row.scrollLeft += e.deltaY; } }, { passive: false });
  }
}
function navState(row) {
  const [prev, next] = row.parentElement.querySelectorAll('.days-nav');
  prev.disabled = row.scrollLeft <= 2; next.disabled = row.scrollLeft + row.clientWidth >= row.scrollWidth - 2;
}
const val = id => (document.getElementById(id)?.value || '').trim();

document.addEventListener('click', e => {
  const m = e.target.closest('[data-mode]'), d = e.target.closest('[data-day]'), s = e.target.closest('[data-slot]'), sc = e.target.closest('[data-scroll]');
  if (sc) { const row = document.getElementById('days'); row.scrollBy({ left: +sc.dataset.scroll * row.clientWidth * 0.8 }); return; }
  const pl = e.target.closest('[data-place]');
  if (pl) { B.loc = pl.dataset.place; B.slot = null; B.day = null; regroup(); renderBooking(); return; }
  if (d) { B.day = d.dataset.day; B.slot = null; renderBooking(); }
  if (s) { B.slot = s.dataset.slot; renderBooking(); document.getElementById('bk-name').focus({ preventScroll: true }); }
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'f-book') return;
  e.preventDefault();
  const err = document.getElementById('bk-err'), btn = document.getElementById('bk-go');
  const name = val('bk-name'), phone = val('bk-phone'), email = val('bk-email');
  if (!B.slot) return err.textContent = 'Elige un día y una hora.';
  if (name.length < 3) return err.textContent = 'Escribe tu nombre completo.';
  if (phone.replace(/\D/g, '').length < 8) return err.textContent = 'Escribe tu teléfono con al menos 8 dígitos.';
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err.textContent = 'El correo no es válido.';
  btn.disabled = true; btn.textContent = 'Apartando tu horario…';
  const { data, error } = await sb.rpc('book_appointment', { p_psych: P.id, p_starts_at: B.slot, p_mode: locOf(B.loc)?.kind || 'en_linea', p_location: B.loc,
    p_name: name, p_phone: phone, p_email: email || null, p_note: val('bk-note') || null });
  if (!error && data.ok) { location.href = 'cita.html?t=' + data.token + '&nueva=1'; return; }
  const code = error ? 'network' : data.error;
  const MSG = { slot_taken: 'Alguien acaba de apartar ese horario. Elige otro.', too_many: 'Ya tienes 3 citas pendientes con este especialista.', location: 'Elige un consultorio.',
    name: 'Escribe tu nombre completo.', phone: 'Revisa tu teléfono.', email: 'Revisa tu correo.', network: 'No pudimos conectarnos. Intenta de nuevo.' };
  if (code === 'slot_taken') { B.slot = null; await loadSlots(); }
  else renderBooking();
  document.getElementById('bk-err').textContent = MSG[code] || 'No se pudo apartar la cita. Intenta de nuevo.';
});

load();
})();
</script>
</body>
</html>
