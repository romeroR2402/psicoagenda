<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evento · MiConsulta</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#006bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MiConsulta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
.page{padding-block:24px 56px;max-width:760px;margin:0 auto}
.cover{width:100%;aspect-ratio:16/8;object-fit:cover;border-radius:16px;background:var(--line);display:block}
.cover-ph{display:grid;place-items:center;color:var(--calm);background:var(--accent-soft)}
.ev h1{font-size:clamp(24px,4.4vw,34px);margin:18px 0 8px}
.facts{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.facts div{display:flex;gap:12px;align-items:flex-start;font-weight:600}
.facts svg{flex:none;color:var(--accent);margin-top:2px}
.facts small{display:block;color:var(--muted);font-weight:500}
.rsvp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.banner{border-radius:16px;padding:14px 16px;font-weight:600;font-size:14px}
@media (max-width:520px){.rsvp{grid-template-columns:1fr}}
</style>
</head>
<body class="wash">
<header class="topbar"><div class="wrap gutter">
  <a class="brand" href="index.html"><i><svg viewBox="6 8 20 20" width="22" height="22" aria-hidden="true"><path d="M16 26c-6-3.8-9.6-7.8-9.6-12.3A5.2 5.2 0 0 1 16 10.6a5.2 5.2 0 0 1 9.6 3.1C25.6 18.2 22 22.2 16 26z" fill="currentColor"/><path d="M16 22.2v-5" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round"/><path d="M16 18.4c0-2.5 1.7-4 4.1-4 0 2.5-1.7 4-4.1 4zM16 19.6c0-2.1-1.5-3.4-3.5-3.4 0 2.1 1.5 3.4 3.5 3.4z" fill="var(--accent)"/></svg></i>MiConsulta</a>
</div></header>
<main class="page gutter"><div class="stack" id="root"><div class="empty">Cargando evento…</div></div></main>

<footer class="mini-foot"><a href="aviso-privacidad.html">Aviso de privacidad</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="assets/common.js"></script>
<script>
(() => {
const { sb, esc, av, ic, fmtDay, fmtTime, toast, copy } = PA;
const root = document.getElementById('root');
const qp = new URLSearchParams(location.search), invite = qp.get('i') || '', open = qp.get('e') || '';
const token = invite || open;
let E = null, joinUrl = null, SITE = null;
// Cómo se entra según el link: grupo de WhatsApp, WhatsApp del especialista o videollamada
const viaOf = url => /^https:\/\/chat\.whatsapp\.com\//i.test(url || '') ? 'grupo' : /^https:\/\/(wa\.me|api\.whatsapp\.com)\//i.test(url || '') ? 'llamada' : 'link';
const val = id => (document.getElementById(id)?.value || '').trim();

async function load() {
  if (!sb || !/^[a-f0-9]{16,}$/.test(token)) return fail();
  const { data, error } = await sb.rpc('get_event', { p_token: token });
  if (error || !data || !data.ok) return fail();
  E = data; joinUrl = data.online_url || joinUrl;
  SITE = PA.siteSlug(E.professional?.slug);
  if (SITE) PA.siteBrand({ name: E.professional.name, title: E.professional.title, photo: E.professional.photo_url, slug: E.professional.slug });
  document.title = `${E.title} · ${SITE ? E.professional.name : 'MiConsulta'}`; render();
}
function fail() { root.innerHTML = '<div class="card"><h2>No encontramos esta conferencia</h2><p class="muted">Revisa que el link esté completo o pide uno nuevo a quien te invitó.</p></div>'; }

function render() {
  const tz = E.professional?.timezone || PA.TZ, pr = E.professional || {};
  const left = E.capacity ? Math.max(0, E.capacity - E.confirmed) : null;
  const gmaps = E.location ? PA.gdir(E.location) : E.place ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(E.place)}` : '';
  let action = '';
  if (E.past) action = '<div class="banner p-mute">Esta conferencia ya terminó.</div>';
  else if (E.invite) {
    action = `<h2>${esc(E.name)}, ¿asistirás?</h2>
      ${E.status === 'confirmado' ? '<div class="banner p-ok">Confirmaste tu asistencia. ¡Te esperamos!</div>' : E.status === 'no_asiste' ? '<div class="banner p-mute">Indicaste que no podrás asistir. Si cambias de opinión, confirma abajo.</div>' : ''}
      <div class="rsvp" style="margin-top:12px"><button class="btn pri big" data-a="rsvp" data-s="confirmado" ${E.status === 'confirmado' ? 'disabled' : ''}>Asistiré</button>
        <button class="btn neu big" data-a="rsvp" data-s="no_asiste" ${E.status === 'no_asiste' ? 'disabled' : ''}>No podré asistir</button></div>`;
  } else if (left === 0 && !joinUrl) action = '<div class="banner p-bad">El cupo de esta conferencia está lleno.</div>';
  else action = joinUrl ? '<div class="banner p-ok">¡Listo! Tu lugar está registrado.</div>' : `<h2>Regístrate</h2><p class="muted small" style="margin:4px 0 12px">Aparta tu lugar con tu nombre y teléfono.</p>
      <form class="form" id="f-reg" novalidate>
        <label class="field"><span>Nombre completo</span><input id="rg-name" autocomplete="name"></label>
        <label class="field"><span>Teléfono (WhatsApp)</span><input id="rg-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ej. 55 1234 5678"></label>
        <label class="field"><span>Correo (para el recordatorio)</span><input id="rg-email" type="email" autocomplete="email"></label>
        <label class="consent"><input type="checkbox" id="rg-ok"><span>He leído el <a href="aviso-privacidad.html" target="_blank" rel="noopener">Aviso de privacidad</a> y doy mi consentimiento expreso para el tratamiento de mis datos personales, incluidos los de salud.</span></label>
        <p class="err" id="rg-err"></p><button class="btn pri big">Apartar mi lugar</button></form>`;
  root.innerHTML = `<article class="ev">
    ${E.image_url ? `<img class="cover" src="${esc(E.image_url)}" alt="">` : `<div class="cover cover-ph">${ic('users', 48)}</div>`}
    <span class="tag" style="margin-top:18px;display:inline-block">${{ conferencia: 'Conferencia', taller: 'Taller', grupo: 'Grupo de apoyo' }[E.kind] || 'Conferencia'} · ${E.price ? PA.money(E.price) : 'Gratis'}</span>
    <h1 style="margin-top:8px">${esc(E.title)}</h1>
    <div class="who">${av(pr.name, 'sm', pr.photo_url)}<div><b>${esc(pr.name || '')}</b><small>${esc(pr.title || '')}</small></div></div>
    <div class="facts">
      <div>${ic('cal', 20)}<span>${fmtDay(E.starts_at, tz)}<small>${fmtTime(E.starts_at, tz)} – ${fmtTime(E.ends_at, tz)}</small></span></div>
      <div>${ic(E.mode === 'en_linea' ? 'video' : 'pin', 20)}<span>${E.mode === 'en_linea' ? (joinUrl ? { link: 'En línea', grupo: 'En línea por grupo de WhatsApp', llamada: 'En línea por videollamada de WhatsApp' }[viaOf(joinUrl)] : 'En línea') : esc(E.place || 'Presencial')}
        <small>${E.mode === 'en_linea' ? (joinUrl ? { link: 'Este es tu link para entrar:', grupo: 'La conferencia será en un grupo de WhatsApp:', llamada: 'La conferencia será por videollamada de WhatsApp. Escríbele para que te agregue:' }[viaOf(joinUrl)] : 'El acceso aparece al confirmar tu asistencia.') : gmaps ? `<a href="${esc(gmaps)}" target="_blank" rel="noopener">Cómo llegar en Google Maps</a>` : ''}</small></span></div>
      ${E.capacity ? `<div>${ic('users', 20)}<span>${E.confirmed} confirmados<small>${left > 0 ? `Quedan ${left} lugares` : 'Cupo lleno'}</small></span></div>` : `<div>${ic('users', 20)}<span>${E.confirmed} confirmados</span></div>`}
    </div>
    ${joinUrl ? (viaOf(joinUrl) === 'link' ? `<a class="btn calm big" href="${esc(joinUrl)}" target="_blank" rel="noopener">${ic('video', 18)} Entrar a la conferencia</a>`
      : viaOf(joinUrl) === 'grupo' ? `<a class="btn big" style="background:#25d366;color:#fff" href="${esc(joinUrl)}" target="_blank" rel="noopener">${ic('phone', 18)} Unirme al grupo de WhatsApp</a>`
      : `<a class="btn big" style="background:#25d366;color:#fff" href="${esc(joinUrl)}?text=${encodeURIComponent(`Hola, confirmé mi asistencia a la conferencia "${E.title}".`)}" target="_blank" rel="noopener">${ic('phone', 18)} Escribir por WhatsApp</a>`) : ''}
    ${E.description ? `<section class="card" style="margin-top:16px"><h3>Acerca de la conferencia</h3><p class="pre" style="margin:8px 0 0">${esc(E.description)}</p></section>` : ''}
    <section class="card" style="margin-top:16px">${action}</section>
    ${pr.slug ? `<p class="muted small" style="margin-top:14px">¿Quieres una consulta? <a href="perfil.html?${SITE ? 'sitio' : 'p'}=${encodeURIComponent(pr.slug)}">Agenda con ${esc((pr.name || '').split(' ')[0])}</a>.</p>` : ''}
  </article>`;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a="rsvp"]'); if (!b) return;
  b.disabled = true;
  const { data, error } = await sb.rpc('event_rsvp', { p_token: invite, p_status: b.dataset.s });
  if (error || !data.ok) { b.disabled = false; return toast(data && data.error === 'full' ? 'El cupo ya está lleno.' : 'No se pudo guardar. Intenta de nuevo.'); }
  toast(b.dataset.s === 'confirmado' ? '¡Asistencia confirmada!' : 'Gracias por avisar');
  load();
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'f-reg') return;
  e.preventDefault();
  const err = document.getElementById('rg-err'), btn = e.target.querySelector('button');
  const name = val('rg-name'), phone = val('rg-phone'), email = val('rg-email');
  if (name.length < 3) return err.textContent = 'Escribe tu nombre completo.';
  if (!document.getElementById('rg-ok').checked) return err.textContent = 'Para registrarte, acepta el Aviso de privacidad.';
  if (phone.replace(/\D/g, '').length < 8) return err.textContent = 'Escribe tu teléfono con al menos 8 dígitos.';
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return err.textContent = 'Revisa tu correo.';
  btn.disabled = true; btn.textContent = 'Apartando…';
  const { data, error } = await sb.rpc('event_register', { p_token: open, p_name: name, p_phone: phone, p_email: email || null });
  if (error || !data.ok) { btn.disabled = false; btn.textContent = 'Apartar mi lugar'; err.textContent = data && data.error === 'full' ? 'El cupo ya está lleno.' : data && data.error === 'past' ? 'Esta conferencia ya terminó.' : 'No se pudo registrar. Revisa tus datos.'; return; }
  // Desde ahora se usa su link personal para que pueda volver a verlo
  history.replaceState(null, '', location.pathname + '?i=' + data.token + (SITE ? '&sitio=' + encodeURIComponent(SITE) : ''));
  location.reload();
});
load();
})();
</script>
</body>
</html>
