<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Administración · MiConsulta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
.page{padding-block:28px 64px}
.auth{max-width:440px;margin:48px auto}
.title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.title-row h1{font-size:clamp(24px,3vw,30px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-weight:600}
.tbl-wrap{overflow-x:auto;background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:860px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;text-align:center}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.sec{margin-top:18px}
.sec h4{margin:0 0 8px;font-size:15px}
.ans{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.ans li{display:flex;justify-content:space-between;gap:12px}
.ans li span{color:var(--muted)}
.qlist{margin:8px 0 0;padding-left:20px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.qlist small{color:var(--muted)}
.note{background:var(--calm-soft);color:var(--calm);border-radius:14px;padding:12px 14px;font-size:13px;font-weight:600}
</style>
</head>
<body class="wash">
<header class="topbar"><div class="wrap gutter">
  <a class="brand" href="index.html"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg></i>MiConsulta <span class="pill p-calm" style="font-family:var(--f-body)">Admin</span></a>
  <nav class="top-links" id="top-user"></nav>
</div></header>
<main class="page"><div class="wrap gutter" id="root"><div class="empty">Cargando…</div></div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="assets/common.js"></script>
<script>
(() => {
const { sb, esc, av, ic, money, MODE, DOW, fmtDT, fmtShort, pill, toast, openModal, closeModal, copy, norm } = PA;
const root = document.getElementById('root');
const S = { authKnown: false, user: null, isAdmin: null, users: [], q: '', tab: location.hash === '#pacientes' ? 'clients' : location.hash === '#ajustes' ? 'settings' : 'pros', settings: null, clients: [], cq: '' };
const QTYPES = { single: 'Una opción', multi: 'Varias opciones', scale: 'Escala 1 a 5', freq: 'Frecuencia', text: 'Respuesta abierta' };
const FREQ = ['Nunca', 'Varios días', 'Más de la mitad de los días', 'Casi todos los días'];
const val = id => (document.getElementById(id)?.value || '').trim();
const setErr = (id, m) => { const e = document.getElementById(id); if (e) e.textContent = m; return false; };
const date = d => d ? new Date(d).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';

if (!sb) root.innerHTML = '<div class="empty">No se pudo cargar la conexión.</div>';
else sb.auth.onAuthStateChange((ev, session) => {
  const prev = S.user && S.user.id;
  S.authKnown = true; S.user = session ? session.user : null;
  if ((S.user && S.user.id) !== prev) { S.isAdmin = null; if (S.user) setTimeout(load, 0); }
  render();
});

async function load() {
  const { data } = await sb.rpc('is_admin');
  S.isAdmin = !!data;
  if (S.isAdmin) {
    const [r, st, cl] = await Promise.all([sb.rpc('admin_list_psychologists'), sb.from('platform_settings').select('*').maybeSingle(),
      sb.from('clients').select('id,full_name,email,phone,created_at,owner_id').order('created_at', { ascending: false }).limit(2000)]);
    S.users = r.error ? [] : r.data; S.settings = st.data; S.clients = cl.data || [];
  }
  render();
}

function render() {
  document.getElementById('top-user').innerHTML = S.user ? `<a class="btn neu sm" href="panel.html">Mi panel</a><button class="btn neu sm" data-a="logout">${ic('out', 15)} Salir</button>` : '';
  if (!S.authKnown) return;
  if (!S.user) {
    root.innerHTML = `<div class="auth"><div class="card form"><div><h1 style="font-size:26px">Administración</h1><p class="muted" style="margin:0">Entra con tu cuenta de super administrador.</p></div>
      <label class="field"><span>Correo</span><input id="lg-email" type="email" autocomplete="email"></label>
      <label class="field"><span>Contraseña</span><input id="lg-pass" type="password" autocomplete="current-password"></label>
      <p class="err" id="lg-err"></p><button class="btn pri big" data-a="login">Entrar</button></div></div>`;
    return;
  }
  if (S.isAdmin === null) { root.innerHTML = '<div class="empty">Verificando permisos…</div>'; return; }
  if (!S.isAdmin) { root.innerHTML = '<div class="auth"><div class="card"><h2>Sin permisos</h2><p class="muted">Esta cuenta no es de administrador. Entra con la cuenta de super administrador.</p></div></div>'; return; }
  const tabs = `<div class="seg" role="tablist" style="margin-bottom:18px">${[['pros', 'Especialistas'], ['clients', 'Pacientes'], ['settings', 'Ajustes']].map(([k, t]) => `<button data-a="tab" data-t="${k}" aria-pressed="${S.tab === k}">${t}</button>`).join('')}</div>`;
  if (S.tab === 'clients') { root.innerHTML = tabs + clientsView(); return; }
  if (S.tab === 'settings') { root.innerHTML = tabs + settingsView(); return; }
  const U = S.users, pros = U.filter(u => u.profile);
  const q = norm(S.q);
  const soon = U.filter(u => { const a = acc(u); return a.k === 'ok' && a.days <= 7; }).length;
  const month = new Date().toISOString().slice(0, 7);
  const rows = U.filter(u => !q || norm([u.email, u.profile?.full_name, u.profile?.title].join(' ')).includes(q));
  root.innerHTML = tabs + `<div class="title-row"><h1>Especialistas registrados</h1><button class="btn neu sm" data-a="reload">Actualizar</button></div>
    <div class="stats">
      <div class="card stat"><b>${U.length}</b><small>Cuentas registradas</small></div>
      <div class="card stat"><b>${U.filter(u => ['ok', 'trial'].includes(acc(u).k)).length}</b><small>Con acceso activo</small></div>
      <div class="card stat"><b>${soon + U.filter(u => acc(u).k === 'trial' && acc(u).days <= 7).length}</b><small>Vencen en 7 días o menos</small></div>
      <div class="card stat"><b>${U.filter(u => acc(u).k === 'off').length}</b><small>Sin acceso o vencidos</small></div>
      <div class="card stat"><b>${pros.filter(u => u.profile.is_listed && u.profile.is_active && acc(u).k !== 'off').length}</b><small>Visibles en el buscador</small></div>
      <div class="card stat"><b>${U.reduce((n, u) => n + u.appointments, 0)}</b><small>Citas totales</small></div>
    </div>
    <label class="field" style="max-width:420px;margin-bottom:14px"><span>Buscar</span><input id="q" type="search" placeholder="Nombre o correo" value="${esc(S.q)}"></label>
    <div class="tbl-wrap"><table><thead><tr><th>Especialista</th><th>Usuario (correo)</th><th>Acceso</th><th>Perfil</th><th>Último acceso</th><th>Citas</th><th>Pacientes</th><th>Encuestas</th><th>Acciones</th></tr></thead><tbody>
      ${rows.map(u => { const p = u.profile;
        const st = !u.confirmed ? '<span class="pill p-warn">Correo sin confirmar</span>' : !p ? '<span class="pill p-mute">Sin perfil</span>' : !p.is_active ? '<span class="pill p-bad">Desactivado</span>' : p.is_listed ? '<span class="pill p-ok">Publicado</span>' : '<span class="pill p-mute">No publicado</span>';
        return `<tr><td><div class="who">${av(p?.full_name || u.email, 'sm', p?.photo_url)}<div><b>${esc(p?.full_name || '—')}</b><small>${esc(p?.title || '')}${u.is_admin ? ' · Admin' : ''}</small></div></div></td>
          <td>${esc(u.email)}<small class="muted" style="display:block">Desde ${date(u.created_at)}</small></td><td>${accPill(u)}</td><td>${st}</td><td>${date(u.last_sign_in_at)}</td>
          <td class="num">${u.appointments}</td><td class="num">${u.clients}</td><td class="num">${u.surveys}</td>
          <td><div class="acts">${u.is_admin ? '' : `<button class="btn pri sm" data-a="access" data-id="${u.id}">Acceso</button>`}<button class="btn neu sm" data-a="detail" data-id="${u.id}">Ver</button><button class="btn sec sm" data-a="pass" data-id="${u.id}">Contraseña</button></div></td></tr>`; }).join('') || '<tr><td colspan="9"><div class="empty">Sin resultados.</div></td></tr>'}
    </tbody></table></div>`;
}

const userOf = id => S.users.find(u => u.id === id);
const PLAN = { prueba: 'Prueba', mensual: 'Mensual', trimestral: 'Trimestral', semestral: 'Semestral', anual: 'Anual', personalizado: 'Personalizado', sin_acceso: 'Sin acceso' };
// Estado de acceso: admin, trial (prueba vigente), ok (pagado vigente) u off (vencido o sin acceso)
function acc(u) {
  if (u.is_admin) return { k: 'admin', days: Infinity };
  const s = u.subscription, until = s && s.access_until ? new Date(s.access_until) : null;
  const days = until ? Math.ceil((until - Date.now()) / 864e5) : -Infinity;
  if (!until || days <= 0) return { k: 'off', days, until, plan: s ? s.plan : 'sin_acceso' };
  return { k: s.plan === 'prueba' ? 'trial' : 'ok', days, until, plan: s.plan };
}
function accPill(u) {
  const a = acc(u);
  if (a.k === 'admin') return '<span class="pill p-calm">Administrador</span>';
  if (a.k === 'off') return `<span class="pill p-bad">${a.until ? 'Venció el ' + date(a.until) : 'Sin acceso'}</span>`;
  return `<span class="pill ${a.k === 'trial' ? 'p-warn' : 'p-ok'}">${PLAN[a.plan]} · ${a.days <= 7 ? `vence en ${a.days} día${a.days === 1 ? '' : 's'}` : 'hasta ' + date(a.until)}</span>`;
}

async function accessModal(id) {
  const u = userOf(id), a = acc(u), def = S.settings?.auto_trial_days || 14;
  const { data: pays } = await sb.from('subscription_payments').select('*').eq('user_id', id).order('created_at', { ascending: false });
  openModal(`<h3>Acceso de ${esc(u.profile?.full_name || u.email)}</h3>
    <p class="sub">${esc(u.email)} · ${accPill(u)}${u.paid_total > 0 ? ` · Total pagado: <b>$${Number(u.paid_total).toLocaleString('es-MX')} MXN</b>` : ''}</p>
    <div class="card" style="box-shadow:none;border:1px solid var(--line)"><h4 style="margin:0 0 10px">Registrar un pago</h4><div class="form">
      <div class="row2"><label class="field"><span>Monto (MXN)</span><input id="ac-amount" type="number" min="0" step="50" placeholder="Ej. 499"></label>
        <label class="field"><span>Método</span><select id="ac-method"><option>Transferencia</option><option>Efectivo</option><option>Depósito</option><option>Tarjeta</option><option>Otro</option></select></label></div>
      <div class="row2"><label class="field"><span>Periodo que cubre</span><select id="ac-period"><option value="mensual|30">1 mes</option><option value="trimestral|90">3 meses</option><option value="semestral|180">6 meses</option><option value="anual|365">1 año</option><option value="personalizado|0">Otro (días)</option></select></label>
        <label class="field" id="ac-days-w" hidden><span>Días</span><input id="ac-days" type="number" min="1" max="3660" value="30"></label></div>
      <label class="field"><span>Nota (opcional)</span><input id="ac-note" maxlength="300" placeholder="Ej. Pagó por transferencia, folio 1234"></label>
      <p class="small muted" style="margin:0">Se suma a partir de ${a.k === 'off' ? 'hoy' : 'su fecha de vencimiento actual (' + date(a.until) + ')'}.</p>
      <p class="err" id="ac-err"></p><button class="btn pri" data-a="pay" data-id="${id}">Registrar pago y dar acceso</button></div></div>
    <div class="card" style="box-shadow:none;border:1px solid var(--line);margin-top:12px"><h4 style="margin:0 0 10px">Prueba gratis</h4>
      <div class="row2" style="align-items:end"><label class="field"><span>Días de prueba a partir de hoy</span><input id="ac-trial" type="number" min="1" max="365" value="${def}"></label>
      <button class="btn sec" data-a="trial" data-id="${id}">Dar prueba</button></div></div>
    <div class="card" style="box-shadow:none;border:1px solid var(--line);margin-top:12px"><h4 style="margin:0 0 6px">Quitar acceso</h4>
      <p class="small muted" style="margin:0 0 10px">Ya no podrá modificar nada en su panel y su perfil desaparece del buscador. Sus datos no se borran.</p>
      <button class="btn danger" data-a="revoke" data-id="${id}" ${a.k === 'off' ? 'disabled' : ''}>Quitar acceso ahora</button></div>
    <h4 style="margin:18px 0 8px">Historial de pagos</h4>
    ${(pays || []).length ? `<div class="tbl-wrap" style="box-shadow:none;border:1px solid var(--line)"><table style="min-width:520px"><thead><tr><th>Fecha</th><th>Monto</th><th>Método</th><th>Cubre</th><th>Nota</th></tr></thead><tbody>
      ${pays.map(x => `<tr><td>${date(x.created_at)}</td><td>$${Number(x.amount).toLocaleString('es-MX')}</td><td>${esc(x.method)}</td><td>${date(x.covers_from)} – ${date(x.covers_until)}</td><td>${esc(x.note || '')}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="empty">Aún no hay pagos registrados.</div>'}`, true);
}

function clientsView() {
  const owner = id => S.users.find(u => u.id === id);
  const q = norm(S.cq);
  const list = S.clients.filter(c => !q || norm([c.full_name, c.phone, c.email, owner(c.owner_id)?.profile?.full_name].join(' ')).includes(q));
  return `<div class="title-row"><h1>Pacientes</h1><span class="muted">${S.clients.length} en total</span></div>
    <label class="field" style="max-width:420px;margin-bottom:14px"><span>Buscar</span><input id="cq" type="search" placeholder="Nombre, teléfono, correo o especialista" value="${esc(S.cq)}"></label>
    <div class="tbl-wrap"><table style="min-width:720px"><thead><tr><th>Paciente</th><th>Teléfono</th><th>Correo</th><th>Especialista</th><th>Registrado</th></tr></thead><tbody>
      ${list.slice(0, 500).map(c => { const o = owner(c.owner_id); return `<tr><td><div class="who">${av(c.full_name, 'sm')}<b>${esc(c.full_name)}</b></div></td><td>${esc(c.phone)}</td><td>${esc(c.email || '—')}</td>
        <td>${o ? `<button class="link" data-a="detail" data-id="${o.id}">${esc(o.profile?.full_name || o.email)}</button>` : '—'}</td><td>${date(c.created_at)}</td></tr>`; }).join('') || '<tr><td colspan="5"><div class="empty">Sin pacientes.</div></td></tr>'}
    </tbody></table></div>${list.length > 500 ? '<p class="muted small">Mostrando los primeros 500. Usa el buscador para encontrar a alguien.</p>' : ''}`;
}

function settingsView() {
  const st = S.settings || {};
  return `<div class="title-row"><h1>Ajustes</h1></div>
    <section class="card form" style="max-width:640px">
      <label class="field"><span>Días de prueba gratis al registrarse</span><input id="st-trial" type="number" min="0" max="365" value="${st.auto_trial_days ?? 14}"><small class="muted">Pon 0 si prefieres activar a cada especialista a mano.</small></label>
      <label class="field"><span>Tu contacto para renovar el acceso</span><textarea id="st-contact" maxlength="300" placeholder="Ej. WhatsApp 55 1234 5678 · correo@ejemplo.com">${esc(st.admin_contact || '')}</textarea><small class="muted">Lo ven los especialistas cuando su prueba está por vencer o ya venció.</small></label>
      <p class="err" id="st-err"></p><button class="btn pri" data-a="saveSettings">Guardar ajustes</button></section>`;
}

async function detail(id) {
  const u = userOf(id), p = u.profile;
  openModal(`<h3>${esc(p?.full_name || u.email)}</h3><p class="sub">Cargando información…</p>`, true);
  const [loc, sch, off, ap, cl, sv, lk] = await Promise.all([
    sb.from('locations').select('*').eq('owner_id', id), sb.from('schedules').select('*').eq('owner_id', id).order('weekday').order('start_time'),
    sb.from('time_off').select('*').eq('owner_id', id).order('date_from'), sb.from('appointments').select('*').eq('psychologist_id', id).order('starts_at', { ascending: false }).limit(30),
    sb.from('clients').select('*').eq('owner_id', id).order('full_name'), sb.from('surveys').select('*').eq('owner_id', id).order('created_at', { ascending: false }),
    sb.from('survey_links').select('*').eq('owner_id', id)]);
  const tz = p?.timezone || PA.TZ, links = lk.data || [];
  const sched = [1, 2, 3, 4, 5, 6, 0].map(d => { const r = (sch.data || []).filter(s => s.weekday === d); return r.length ? `<li><b>${DOW[d]}:</b> ${r.map(s => s.start_time.slice(0, 5) + '–' + s.end_time.slice(0, 5)).join(', ')}</li>` : ''; }).join('');
  openModal(`<h3>${esc(p?.full_name || u.email)}</h3><p class="sub">${esc(u.email)} · registrado el ${date(u.created_at)}</p>
    <div class="note">Vista de solo lectura. Ves lo mismo que este especialista, pero no puedes modificar sus datos.</div>
    ${p ? `<div class="sec"><h4>Perfil</h4><dl class="kv"><dt>Título</dt><dd>${esc(p.title || '—')}</dd><dt>Cédula</dt><dd>${esc(p.license || '—')}</dd><dt>Precio</dt><dd>${money(p.price)}</dd><dt>Sesión</dt><dd>${p.session_minutes} min</dd>
      <dt>Perfil público</dt><dd><a href="perfil.html?p=${encodeURIComponent(p.slug)}" target="_blank" rel="noopener">${esc(p.slug)}</a></dd><dt>En buscador</dt><dd>${p.is_listed ? 'Sí' : 'No'}</dd></dl>
      <div class="acts" style="margin-top:10px"><button class="btn ${p.is_active ? 'danger' : 'pri'} sm" data-a="toggleActive" data-id="${id}">${p.is_active ? 'Desactivar perfil' : 'Reactivar perfil'}</button></div></div>` : '<div class="sec"><p class="muted">Aún no crea su perfil.</p></div>'}
    <div class="sec"><h4>Ubicaciones</h4>${(loc.data || []).map(l => `<div class="small">• ${esc(l.name)} — ${l.kind === 'en_linea' ? 'En línea' : esc([l.address, l.city].filter(Boolean).join(', '))}</div>`).join('') || '<p class="muted small">Sin ubicaciones.</p>'}</div>
    <div class="sec"><h4>Horario</h4>${sched ? `<ul class="qlist">${sched}</ul>` : '<p class="muted small">Sin horario.</p>'}
      ${(off.data || []).length ? `<p class="small muted" style="margin-top:6px">Descansos: ${off.data.map(t => fmtShort(t.date_from + 'T12:00:00') + (t.date_to !== t.date_from ? ' – ' + fmtShort(t.date_to + 'T12:00:00') : '')).join(', ')}</p>` : ''}</div>
    <div class="sec"><h4>Últimas citas (${(ap.data || []).length})</h4>${(ap.data || []).map(a => `<div class="who" style="padding:6px 0">${av(a.patient_name, 'sm')}<div style="flex:1"><b>${esc(a.patient_name)}</b><small>${fmtDT(a.starts_at, tz)} · ${MODE[a.mode]} · ${esc(a.patient_phone)}</small></div>${pill(a.status)}</div>`).join('') || '<p class="muted small">Sin citas.</p>'}</div>
    <div class="sec"><h4>Pacientes (${(cl.data || []).length})</h4>${(cl.data || []).map(c => `<div class="small">• ${esc(c.full_name)} · ${esc(c.phone)}${c.email ? ' · ' + esc(c.email) : ''}</div>`).join('') || '<p class="muted small">Sin pacientes.</p>'}</div>
    <div class="sec"><h4>Encuestas (${(sv.data || []).length})</h4>${(sv.data || []).map(s => { const ls = links.filter(l => l.survey_id === s.id), done = ls.filter(l => l.status === 'done');
      return `<div class="card" style="box-shadow:none;margin-bottom:10px"><b>${esc(s.title)}</b><div class="muted small">${s.questions.length} preguntas · ${done.length} de ${ls.length} respondidas</div>
        <ol class="qlist">${s.questions.map(q => `<li>${esc(q.text)} <small>(${QTYPES[q.type]}${q.options ? ': ' + q.options.map(esc).join(', ') : ''})</small></li>`).join('')}</ol>
        ${done.map(l => `<details style="margin-top:8px"><summary class="small"><b>${esc(l.respondent_name)}</b> · ${fmtDT(l.answered_at, tz)}</summary><ul class="ans">${s.questions.map((q, i) => `<li><span>${esc(q.text)}</span><b>${fmtAns(q, l.answers[i])}</b></li>`).join('')}</ul></details>`).join('')}</div>`; }).join('') || '<p class="muted small">Sin encuestas.</p>'}</div>`, true);
}
function fmtAns(q, a) {
  if (a == null || a === '' || (Array.isArray(a) && !a.length)) return '—';
  if (q.type === 'multi') return a.map(esc).join(', ');
  if (q.type === 'scale') return a + ' / 5';
  if (q.type === 'freq') return FREQ[a];
  return esc(a);
}

function genPass() {
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', a = new Uint32Array(12);
  crypto.getRandomValues(a); return [...a].map(n => abc[n % abc.length]).join('');
}
function passModal(id) {
  const u = userOf(id);
  openModal(`<h3>Contraseña de ${esc(u.profile?.full_name || u.email)}</h3>
    <p class="sub">Las contraseñas se guardan cifradas: nadie puede verlas, ni siquiera el administrador. Lo que sí puedes hacer es asignar una nueva o enviarle un correo para que la cambie.</p>
    <div class="form">
      <label class="field"><span>Usuario</span><input value="${esc(u.email)}" readonly></label>
      <label class="field"><span>Nueva contraseña temporal</span><input id="np" value="${genPass()}" autocomplete="off"></label>
      <p class="err" id="np-err"></p><p class="ok-msg" id="np-ok"></p>
      <div class="acts"><button class="btn pri" data-a="setPass" data-id="${id}">Asignar esta contraseña</button><button class="btn neu" data-a="regen">Generar otra</button></div>
      <hr style="border:0;border-top:1px solid var(--line);width:100%">
      <button class="btn sec" data-a="sendReset" data-id="${id}">Enviarle correo para que cree su contraseña</button>
      ${u.confirmed ? '' : `<button class="btn neu" data-a="confirm" data-id="${id}">Confirmar su correo manualmente</button>`}
    </div>`);
}
async function callAdmin(body) {
  const { data, error } = await sb.functions.invoke('admin-users', { body });
  if (error) { let m = error.message; try { const j = await error.context.json(); m = j.error || m; } catch (e) {} return { ok: false, error: m }; }
  return data;
}

document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'q' || id === 'cq') { S[id] = e.target.value; const pos = e.target.selectionStart; render(); const q = document.getElementById(id); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('change', e => { if (e.target.id === 'ac-period') document.getElementById('ac-days-w').hidden = !e.target.value.endsWith('|0'); });
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const d = el.dataset;
  switch (d.a) {
    case 'login': {
      el.disabled = true;
      const r = await sb.auth.signInWithPassword({ email: val('lg-email'), password: document.getElementById('lg-pass').value });
      el.disabled = false; if (r.error) setErr('lg-err', 'Correo o contraseña incorrectos.'); break;
    }
    case 'logout': await sb.auth.signOut(); break;
    case 'reload': await load(); toast('Lista actualizada'); break;
    case 'detail': detail(d.id); break;
    case 'tab': S.tab = d.t; history.replaceState(null, '', d.t === 'pros' ? location.pathname : '#' + { clients: 'pacientes', settings: 'ajustes' }[d.t]); render(); break;
    case 'access': accessModal(d.id); break;
    case 'pay': {
      const amount = Number(val('ac-amount')), [plan, n] = val('ac-period').split('|'), days = +n || Math.round(Number(val('ac-days')));
      if (!(amount >= 0) || val('ac-amount') === '') return setErr('ac-err', 'Escribe el monto que te pagó (puede ser 0).');
      if (!(days >= 1 && days <= 3660)) return setErr('ac-err', 'Escribe cuántos días cubre el pago.');
      el.disabled = true;
      const { error } = await sb.rpc('admin_add_payment', { p_user: d.id, p_amount: amount, p_method: val('ac-method'), p_plan: plan, p_days: days, p_note: val('ac-note') || null });
      if (error) { el.disabled = false; return setErr('ac-err', 'No se pudo registrar: ' + error.message); }
      await load(); accessModal(d.id); toast('Pago registrado y acceso extendido'); break;
    }
    case 'trial': {
      const days = Math.round(Number(val('ac-trial'))); if (!(days >= 1 && days <= 365)) return toast('Escribe de 1 a 365 días.');
      el.disabled = true;
      const { error } = await sb.rpc('admin_set_access', { p_user: d.id, p_plan: 'prueba', p_until: new Date(Date.now() + days * 864e5).toISOString(), p_note: null });
      if (error) { el.disabled = false; return toast('No se pudo dar la prueba.'); }
      await load(); accessModal(d.id); toast(`Prueba de ${days} días activada`); break;
    }
    case 'revoke': {
      if (!el.dataset.armed) { el.dataset.armed = 1; el.textContent = 'Toca otra vez para quitar el acceso'; return; }
      el.disabled = true;
      const { error } = await sb.rpc('admin_set_access', { p_user: d.id, p_plan: 'sin_acceso', p_until: null, p_note: null });
      if (error) { el.disabled = false; return toast('No se pudo quitar el acceso.'); }
      await load(); accessModal(d.id); toast('Acceso quitado'); break;
    }
    case 'saveSettings': {
      const days = Math.round(Number(val('st-trial')));
      if (!(days >= 0 && days <= 365)) return setErr('st-err', 'Los días de prueba deben ser de 0 a 365.');
      el.disabled = true;
      const { data, error } = await sb.from('platform_settings').update({ auto_trial_days: days, admin_contact: val('st-contact') || null, updated_at: new Date().toISOString() }).eq('id', true).select().single();
      el.disabled = false;
      if (error) return setErr('st-err', 'No se pudo guardar.');
      S.settings = data; setErr('st-err', ''); toast('Ajustes guardados'); break;
    }
    case 'pass': passModal(d.id); break;
    case 'regen': document.getElementById('np').value = genPass(); break;
    case 'setPass': {
      const pw = val('np'); if (pw.length < 8) return setErr('np-err', 'Debe tener al menos 8 caracteres.');
      el.disabled = true; const r = await callAdmin({ action: 'set_password', user_id: d.id, password: pw }); el.disabled = false;
      if (!r.ok) return setErr('np-err', 'No se pudo cambiar: ' + r.error);
      setErr('np-err', ''); setErr('np-ok', `Listo. Compártele al especialista su usuario y esta contraseña: ${pw}. Puede cambiarla después desde “Olvidé mi contraseña”.`); break;
    }
    case 'sendReset': {
      el.disabled = true; const u = userOf(d.id);
      const r = await sb.auth.resetPasswordForEmail(u.email, { redirectTo: PA.pageUrl('panel.html') }); el.disabled = false;
      r.error ? setErr('np-err', 'No se pudo enviar el correo. Intenta más tarde.') : setErr('np-ok', `Correo enviado a ${u.email}.`); break;
    }
    case 'confirm': {
      el.disabled = true; const r = await callAdmin({ action: 'confirm_email', user_id: d.id });
      if (!r.ok) { el.disabled = false; return setErr('np-err', 'No se pudo confirmar: ' + r.error); }
      setErr('np-ok', 'Correo confirmado. Ya puede entrar.'); el.remove(); load(); break;
    }
    case 'toggleActive': {
      const u = userOf(d.id); el.disabled = true;
      const { error } = await sb.from('profiles').update({ is_active: !u.profile.is_active }).eq('id', d.id);
      if (error) { el.disabled = false; return toast('No se pudo actualizar.'); }
      await load(); detail(d.id); toast(u.profile.is_active ? 'Perfil desactivado: ya no aparece en el buscador' : 'Perfil reactivado'); break;
    }
  }
});
})();
</script>
</body>
</html>
